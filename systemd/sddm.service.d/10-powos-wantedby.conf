# PowOS: force sddm.service into graphical.target's Wants set.
#
# Same defect the plasmalogin drop-in fixes, for the display manager the Deck
# variant actually uses. Upstream sddm.service ships:
#
#     [Install]
#     Alias=display-manager.service
#
# and NO WantedBy=graphical.target, so `systemctl enable sddm` creates only the
# alias symlink and graphical.target.wants/ stays empty. graphical.target then
# reaches ACTIVE without ever starting a display manager — observed on a Steam
# Deck: boot completes, plymouth quits cleanly, and the journal contains ZERO
# mentions of sddm or display-manager. The user is left on a console.
#
# bazzite-deck has no plasma-login-manager, so the existing plasmalogin drop-in
# does nothing there.
[Install]
WantedBy=graphical.target

[Service]
Restart=on-failure
# A display manager owns the GPU: every start re-initialises the panel. At
# RestartSec=2 a DM that cannot start cycles the screen off and on every couple
# of seconds — on a Deck that shows up as the panel visibly flicking off, with
# amdgpu logging "DTM TA is not initialized" on each re-init, and it makes a
# first boot take far longer than the work warrants.
#
# So back off, and STOP rather than thrash: three attempts in a minute, then
# leave it failed where `systemctl --failed` will show it. A DM that is broken
# stays broken; respawning it faster does not fix it, it just makes the machine
# unusable and hides the reason.
RestartSec=5
StartLimitIntervalSec=60
StartLimitBurst=3
