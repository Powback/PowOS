# PowOS: bound the wait for the network; do NOT remove it.
#
# greenboot's health check is ordered after network-online.target and sits
# ahead of boot-complete.target, so the desktop waits for it. The obvious
# "fix" — dropping greenboot's network dependency so nothing waits — is a
# TRAP, and it cost a Steam Deck a reboot loop:
#
#     [  OK  ] Stopped greenboot-healthcheck.service
#     [  OK  ] Finished systemd-reboot.service
#     [ 34.75] reboot: Restarting system
#
# reproduced in a VM booted with -nic none. Without the ordering, greenboot
# runs before there is any network, does not pass, and greenboot's
# redboot-auto-reboot reboots the machine — forever, on a handheld that is
# simply away from its wifi. "Slow when offline" became "will not boot when
# offline".
#
# So keep the dependency and make satisfying it cheap. nm-online returns as
# soon as a connection comes up, and with no network at all this caps the
# stall at a few seconds instead of the 30s default — while greenboot still
# runs after network-online.target and still passes.
# The leading "-" matters as much as the timeout. nm-online returns non-zero
# when it gives up, so on a device with no network — which for a handheld is
# the normal case, not the exception — the unit goes FAILED on every single
# boot. Nothing breaks (network-online.target only Wants= it, so the target is
# still reached and greenboot still runs), but a red FAILED line every boot is
# a lie about the machine's health. "-" makes a timeout a non-event.
[Service]
ExecStart=
ExecStart=-/usr/bin/nm-online -s -q --timeout=5
