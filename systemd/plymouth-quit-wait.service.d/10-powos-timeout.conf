# PowOS: a boot must not be able to stop here.
#
# plymouth-quit-wait.service runs `plymouth --wait` with TimeoutSec=0, which
# means infinite. On this image plymouthd stops answering, so this unit and
# plymouth-quit.service both hang and the boot never reaches graphical.target
# — no display manager, no console login, nothing to do but hold the power
# button.
#
# Reproduced in a clean QEMU VM off our own raw image: byte-identical
# framebuffer from t120s to t210s, stuck on
#
#     Starting plymouth-quit-wait.servic…d until boot process finishes up...
#     Starting plymouth-quit.service - Terminate Plymouth Boot Screen...
#
# and reported from a Steam Deck in exactly those words.
#
# 20s is long enough for a healthy plymouth to hand the display over, and
# short enough that a broken one costs a pause rather than the machine. The
# unit is only ever Wanted, never Required, so timing out does not fail the
# boot.
[Service]
TimeoutSec=20
