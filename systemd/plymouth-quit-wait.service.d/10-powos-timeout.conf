# PowOS: bound the plymouth handoff.
#
# plymouth-quit-wait.service runs `plymouth --wait` with TimeoutSec=0, which
# means infinite. That is a boot with no upper bound on it: if plymouthd ever
# stops answering, nothing ordered after this unit — the gettys included —
# will ever run.
#
# What was actually observed on this image is milder and nastier. Measured in
# QEMU off our own raw image, the boot does get past here and does reach a
# getty. But plymouth takes the console when plymouth-quit runs, so systemd's
# status output stops mid-sentence, and it paints black while it holds it. A
# machine whose display manager was never started (see
# systemd/powos-installer.service) then looks exactly like a machine that hung
# at this line — which is how it read on a Steam Deck, and how it read to
# every pass over the logs afterwards.
#
# The timeout does not fix that; plymouth.enable=0 on our media and installs
# is what keeps the screen honest. This is here so that the unbounded case
# cannot happen at all. 20s is long enough for a healthy handoff and short
# enough that a broken one costs a pause rather than the machine. Both units
# are only ever Wanted, never Required, so timing out does not fail the boot.
[Service]
TimeoutSec=20
