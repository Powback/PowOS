# PowOS: the desktop must not wait for DHCP.
#
# greenboot ships 10-network-online.conf, which adds:
#
#     After=network-online.target
#     Wants=network-online.target
#
# and greenboot-healthcheck is ordered ahead of boot-complete.target →
# greenboot-success.target → multi-user.target → graphical.target. So the
# graphical session waits for NetworkManager-wait-online to finish. Measured on
# a Steam Deck:
#
#     NetworkManager-wait-online.service +4.530s   on the critical chain to
#     graphical.target, out of 14.2s of userspace
#
# This is not a speed-vs-safety trade, because the wait buys nothing here. The
# only required check that touches the network is 01_repository_dns_check.sh,
# and it resolves whatever hosts are named in /etc/ostree/remotes.d — which on
# a bootc/container system is EMPTY (verified: zero URLs). With no domains to
# check it exits 0 immediately, network or not. Every other check is local.
#
# greenboot still runs, still gates boot-complete.target, and still triggers
# rollback on failure. It simply stops holding the boot open waiting for a
# network this device may not even have.
#
# Resetting both lists clears only what that drop-in added; the ordering
# systemd derives implicitly from DefaultDependencies= is unaffected.
[Unit]
After=
Wants=
