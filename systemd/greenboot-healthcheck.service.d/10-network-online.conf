# PowOS: greenboot must not hold the desktop behind DHCP.
#
# SAME FILENAME as greenboot's own drop-in, so COPYing this into the image
# REPLACES it rather than trying to undo it from a later-sorted file. Upstream
# ships After=/Wants=network-online.target here, and greenboot-healthcheck
# gates boot-complete.target → greenboot-success.target → multi-user.target →
# graphical.target. Measured on a Steam Deck:
#
#     network.target        @9.267s
#     network-online.target @14.275s   <- 5.0s of waiting, on the critical path
#     greenboot-healthcheck @14.279s +330ms
#     graphical.target      @14.634s
#
# This device is a handheld. It boots away from its wifi routinely, and the
# desktop must not care.
#
# This override was removed once, on the theory that it caused a Steam Deck
# reboot loop. It did not: that machine's own journal showed
# bazzite-hardware-setup applying Deck kernel args, staging a deployment and
# rebooting ONCE, then converging — with greenboot passing in every boot,
# offline included. The health check's only network-facing required check
# resolves the hosts in /etc/ostree/remotes.d, which is empty on a
# container-native system, so it passes with or without a network.
#
# greenboot still runs, still gates boot-complete, still triggers rollback on
# failure. It simply stops waiting first.
[Unit]
