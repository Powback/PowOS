# PowOS: stop one daemon's dependency from stalling the whole boot.
#
# Bazzite's cardwired.service ships:
#
#     Wants=systemd-udev-settle.service
#     After=systemd-udev-settle.service
#
# systemd-udev-settle is deprecated upstream ("should not be used") and is
# ordered Before=sysinit.target. So a single unit WANTING it makes all of
# sysinit.target — and therefore basic.target, multi-user.target and the
# desktop — wait for the entire udev queue to drain. Measured on a Steam Deck:
#
#     systemd-udev-settle.service +4.637s   on the critical chain to
#     graphical.target, out of 14.2s of userspace
#
# and it is why `systemd-analyze blame` is topped by dev-ttyS0.device,
# dev-tpm0.device and friends at ~10s each. Those are not work being done;
# they are device units that could not settle until the queue drained.
#
# Only the Wants= is dropped. The After= is left in place: with nothing
# pulling the unit in it never starts, so the ordering is inert, but if
# anything else ever does want it, cardwired still sequences correctly behind
# it. Resetting After= wholesale would also drop the dbus.service ordering
# this daemon genuinely needs.
[Unit]
Wants=
