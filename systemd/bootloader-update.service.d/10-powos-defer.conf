# PowOS: update the bootloader after the desktop, not before it.
#
# bootloader-update.service costs 2.362s on a Steam Deck, every boot, to
# check whether the bootloader needs updating — which it almost never does,
# and which nothing about the current boot depends on. It has no business
# running while the user is looking at a blank screen.
#
# Ordered after graphical.target so it does its work once the machine is
# usable. It still runs on every boot; it just stops being something you wait
# for.
[Unit]
After=graphical.target
