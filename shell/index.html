<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>PowOS Shell</title>
<!--
  The shell is TypeScript (TSX), run as saved: es-module-shims loads each module through this fetch hook, which
  strips the types and compiles the JSX with Sucrase in the page - no build step between an edit and the screen.
  `npm run check` (tsc --noEmit) type-checks it all. The import map names the vendored libraries (vendor/VERSIONS).
-->
<script>
  // Room for every request of a slow start (ui/iconperf.ts counts the icon ones; the default 250 fills up).
  performance.setResourceTimingBufferSize?.(2000);
  window.esmsInitOptions = {
    shimMode: true,
    async fetch(url, options) {
      const res = await fetch(url, options);
      if (!/\.tsx?(\?|$)/.test(url) || !res.ok) return res;
      const { transform } = await import("./vendor/sucrase.js");
      const source = await res.text();
      const { code } = transform(source, {
        transforms: ["typescript", "jsx"],
        jsxRuntime: "automatic",
        jsxImportSource: "preact",
        production: true,
        filePath: url,
      });
      return new Response(new Blob([code + "\n//# sourceURL=" + url], { type: "application/javascript" }));
    },
  };
</script>
<script async src="./vendor/es-module-shims.js"></script>
<script type="importmap-shim">
{
  "imports": {
    "preact": "./vendor/preact.js",
    "preact/hooks": "./vendor/preact-hooks.js",
    "preact/jsx-runtime": "./vendor/preact-jsx-runtime.js",
    "@preact/signals": "./vendor/signals.js",
    "@preact/signals-core": "./vendor/signals-core.js",
    "@xterm/xterm": "./vendor/xterm.js",
    "@xterm/addon-fit": "./vendor/xterm-addon-fit.js",
    "spacetimedb": "./vendor/spacetimedb.js"
  }
}
</script>
<style>
  /* Home's last frame (ui/snapshot.ts) stays up while the live page under it lays itself out, hidden. */
  .snapshot { position: fixed; inset: 0; pointer-events: none; }
  body.booting > :not(.snapshot) { visibility: hidden; }
</style>
<link rel="stylesheet" href="./theme.css" data-hot>
<link rel="stylesheet" href="./ui/shell.css" data-hot>
<link rel="stylesheet" href="./vendor/xterm.css">
<link rel="stylesheet" href="./ui/terminal.css" data-hot>
<link rel="stylesheet" href="./ui/screens.css" data-hot>
<link rel="stylesheet" href="./ui/remote.css" data-hot>
<link rel="stylesheet" href="./ui/notifications.css" data-hot>
<script type="module-shim" src="./app.tsx"></script>
</head>
<body>
<script>
  // Home's last frame (ui/snapshot.ts, version 1), up before the modules have loaded: icons and all on the first
  // frame. The shell's first render replaces it (app.tsx). Its icons' arrival is counted for ui/iconperf.ts.
  try {
    const shot = !new URLSearchParams(location.search).get("mode") && JSON.parse(localStorage.getItem("powos.snapshot." + Math.round(innerWidth)) || "null");
    if (shot && shot.v === 1) {
      document.documentElement.setAttribute("style", shot.style);
      document.documentElement.dataset.mode = "home";
      document.body.innerHTML = shot.html;
      document.body.inert = true;
      const imgs = document.body.querySelectorAll("img");
      const s = (window.__snapshot = { v: 1, at: performance.now(), icons: imgs.length, loaded: 0, last: 0 });
      const one = () => { s.loaded++; s.last = performance.now(); };
      for (const i of imgs) if (i.complete && i.naturalWidth) one(); else i.addEventListener("load", one, { once: true });
    }
  } catch {}
</script>
</body>
</html>
