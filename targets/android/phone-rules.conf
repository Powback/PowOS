skip annobin* gcc-plugin-annobin systemtap-sdt-*   RPM build hardening/probe tooling
skip gpg-pubkey terra-gpg-keys gpgverify   RPM repo signing keys
skip alternatives   Fedora's alternatives system; Arch packages own their paths
skip *-selinux checkpolicy libselinux* libsemanage libsepol python3-libselinux python3-libsemanage python3-policycoreutils python3-setools   SELinux: Arch userland is built without it
skip crypto-policies authselect*   Fedora crypto-policies/authselect
skip *-filesystem   Fedora directory-ownership package; Arch packages own their dirs
skip langpacks-core-* langpacks-fonts-* langtable   Fedora langpack metapackages (the fonts/dicts are listed themselves)
skip f44-backgrounds-* desktop-backgrounds-* plasma-lookandfeel-fedora redhat-menus   Fedora branding and menu layout
skip kde-settings kde-settings-plasma qt-settings nano-default-editor   Fedora system defaults
skip libuser usermode   Fedora-only consolehelper/libuser admin tooling
skip sssd* libsss_* libpasswdqc pam_passwdqc passwdqc-utils corosynclib dlm-lib   enterprise/cluster admin
skip flexiblas   Fedora's BLAS switch shim; Arch picks BLAS by package (blas/openblas mapped below)
skip LCEVCdec libaribcaption libklvanc libxavs davs2-libs xavs2-libs uavs3d-libs uvg266-libs vvdec-libs vvenc-libs xevd-libs xeve-libs openapv-libs svt-av1-libs svt-vp9-libs vo-amrwbenc   codec libs only Fedora's ffmpeg links; Arch's ffmpeg (mapped from ffmpeg-libs) is built without them

# ---- Printing: the phone prints via IPP Everywhere (cups-filters driverless)
skip uld   Samsung x86-only blob
skip braille-printer-app c2esp dymo-cups-drivers printer-driver-brlaser ptouch-driver splix mpage paps   printer drivers/filters not in Arch Linux ARM

