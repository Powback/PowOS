# How PowOS (the published image's manifest: tools/emit-manifest.sh) becomes PowOS on a phone (Arch Linux ARM).
# This is the ONLY hand-written mapping: what PowOS contains comes from PowOS itself. Rules apply top to bottom,
# first match wins; an RPM no rule matches is installed under its own name, and any name Arch doesn't have is
# listed in the build's report (out/phone-report.txt) for review.
#
#   skip    <rpm-glob> <reason>             not on a phone
#   skiparch <arch> <reason>                every RPM of that architecture
#   rename  <rpm-name> <arch-package...>    Arch calls it differently
#   rewrite <regex> <replacement>           name translation pattern (Python re, applied to unmatched names)
#   provide <rpm-name> <how>                comes another way on the phone
#   bundle  <rpm-name>                      content-only package: its files are taken from the image

# ---- Architectures
skiparch i686        32-bit x86 compatibility libraries
skiparch x86_64_v2   CPU-level variants

# ---- Boot, kernel, firmware, drivers: Android's (the phone runs Android's kernel)
skip kernel*                 Android's kernel
skip *firmware*              Android's firmware
skip akmod* kmod*            kernel modules
skip grub2* shim* efi* efibootmgr mokutil   no bootloader in an app
skip dracut* plymouth* bootc* bootupd* rpm-ostree* ostree* greenboot* uupd composefs*   image/boot machinery
skip mesa-* vulkan-radeon* vulkan-intel* xorg-x11-drv-* libva-intel* intel-* amd-* nvidia* *-nvidia*   GPU drivers: Adreno via KGSL Mesa
skip fwupd* thermald tuned* power-profiles-daemon cpupower* scx-*   hardware/power management
skip NetworkManager* iwd wpa_supplicant ModemManager* bluez* blueman   Android owns network and Bluetooth
skip sddm* plasma-login-manager* gdm*   no display manager: the app starts the session
skip systemd* udisks2* upower* terra-upower* polkit* accountsservice   no systemd/logind (stand-ins in the engine)
skip qemu* libvirt* edk2-* virt-* swtpm*   VMs need KVM
skip podman* toolbox distrobox* containers-common* crun runc conmon buildah skopeo   containers need namespaces
skip waydroid* cage   Android in Android / kiosk compositor
skip cockpit* udica setroubleshoot* selinux-* policycoreutils*   server admin / SELinux
skip snapper btrfs* compsize duperemove   no btrfs in an app
skip *-akmod-modules *-kmod-common v4l2loopback kvmfr nct6687d sc0710 gcadapter_oc t150-driver   kernel modules
skip b43-openfwwf microcode_ctl   firmware/microcode
skip zram-generator-defaults memstrack initscripts-service prefixdevname   boot/systemd machinery
skip dmemcg-booster plasma-foreground-booster-dmemcg bpftune-gaming   kernel cgroup/BPF tuning daemons (need systemd + host kernel)
skip udev-hid-bpf* *-udev ublue-os-udev-rules ublue-os-media-automount-udev   udev rules only
skip open-vm-tools* virtualbox-guest-additions hyperv-daemons spice-webdavd   VM guest tools
skip displaylink linux-cec inputattach-cec-units ls-iommu mcelog ryzenadj amdsmi fw-fanctrl system76-driver system76-io powerstat   PC hardware
skip plasma-nm-*   Android owns network and VPNs

# ---- Fedora / ublue infrastructure
skip dnf5* libdnf5* rpm-plugin-* sudo-python-plugin   Fedora package manager plugins
skip fedora-* terra-release*   Fedora repos, branding and configs
skip ublue-os-*   ublue image machinery (signing, akmods, selinux, ujust recipes)
skip bazzite-updater   updates the bootc image; the phone updates with pacman
skip crypto-policies-scripts nss-altfiles rootfiles default-editor bash-color-prompt kde-settings-pulseaudio   Fedora system defaults
skip realmd sssd-kcm pam_afs_session ocfs2-tools sos passwdqc   enterprise/server admin
skip python3-langtable   Fedora installer language data
skip flatpak-spawn   lives inside flatpak runtimes
skip libFAudio   only Wine/Proton use it and they bundle their own
skip qt qt-common   Qt 4, not in Arch
skip kio-extras-kf5 phonon-qt5-backend-vlc   KF5/Qt5 plugins: Arch ships the KF6/Qt6 ones only
skip plasma-setup   first-boot wizard: the app sets up the session

# ---- Printing: the phone prints via IPP Everywhere (cups-filters driverless)
skip uld   Samsung x86-only blob
skip braille-printer-app c2esp dymo-cups-drivers printer-driver-brlaser ptouch-driver splix mpage paps   printer drivers/filters not in Arch Linux ARM

# ---- Steam Deck hardware (the Deck flavour minus its hardware)
skip jupiter-* galileo-* steamdeck-dsp powerbuttond inputplumber hid-replay vpower sdgyrodsu acpica-tools acpid ds-inhibit   Deck hardware
skip steamos-manager* plasma-applet-tdp-control   Deck hardware control
skip openrgb* piper libratbag* logiops i2c-tools lm_sensors ddcutil libcec xwiimote*   PC peripherals

# ---- Content-only packages taken as files
bundle steamdeck-kde-presets
bundle gdouros-symbola-fonts   fonts not in Arch Linux ARM
bundle twitter-twemoji-fonts
bundle nerd-fonts
# PowOS's Steam and Game Mode as shipped: Valve's launcher + bootstrap and the gamescope-session scripts
# (noarch). The x86 parts of Steam run through FEX on the phone; nothing here is a phone rewrite.
bundle steam
bundle steam-devices
bundle gamescope-session
bundle gamescope-session-steam
bundle gamescope-session-ogui-steam

# ---- Built by us from the upstream recipe (recipes.list; Arch Linux ARM has no build)
rename terra-mangohud                         mangohud
rename vkBasalt                               vkbasalt
rename umu-wrapper                            umu-launcher
rename ScopeBuddy                             scopebuddy
rename rom-properties-kf6                     rom-properties
rename rom-properties-utils                   rom-properties
rename obs-studio-plugin-vkcapture-hook-libs  obs-vkcapture
rename cardwire-gui                           cardwire
rename hfsplus-tools                          hfsprogs

# ---- Comes another way
provide maliit-keyboard       Android's keyboard types into KWin
provide fcitx5*               Android's keyboard handles input methods
provide ibus*                 Android's keyboard handles input methods
provide tailscale             one VPN per phone: the Android Tailscale app

