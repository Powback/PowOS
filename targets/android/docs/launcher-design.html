<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PowOS Phone Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!--
  PowOS phone home: interactive design proposal (2026-10-15).
  Single file, no build, no network needed (Google Fonts optional; falls back to system-ui).
  Companion docs: powos-shell-design.md, powos-app-plan.md, android-windows.md (same folder).
-->
<style>
:root{
  --bg:#eef0f6; --panel:#ffffff; --panel-2:#f6f7fb; --ink:#141824; --muted:#5b6274; --line:#dfe3ec;
  --accent:#6a48ff; --accent-2:#0eae9f; --accent-ink:#fff; --warn:#e8930c; --bad:#e5484d; --ok:#22a663;
  --android:#2fbf71; --linux:#6a48ff;
  --wall:radial-gradient(120% 70% at 10% 0%,#cdbfff 0,transparent 55%),radial-gradient(90% 60% at 100% 35%,#a6efe4 0,transparent 55%),radial-gradient(110% 60% at 40% 105%,#ffd3ea 0,transparent 60%),#eef0fb;
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.82); --glass-line:rgba(255,255,255,.75);
  --w-ink:#121521; --w-muted:#535b6e; --w-soft:rgba(20,24,40,.07);
  --shadow:0 10px 30px -12px rgba(30,30,70,.25);
  --frame:#1b1d23; --frame-edge:#3a3e48;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12; --panel:#141821; --panel-2:#1a1f2b; --ink:#e8ebf2; --muted:#98a1b3; --line:#252b39;
    --accent:#8b6bff; --accent-2:#2dd4bf;
    --wall:radial-gradient(120% 70% at 10% 0%,#3b2295 0,transparent 55%),radial-gradient(90% 60% at 100% 35%,#0b5d63 0,transparent 55%),radial-gradient(110% 60% at 40% 105%,#5a1746 0,transparent 60%),#0a0b12;
    --glass:rgba(20,23,33,.55); --glass-2:rgba(28,32,45,.86); --glass-line:rgba(255,255,255,.09);
    --w-ink:#eef1f7; --w-muted:#a2aabc; --w-soft:rgba(255,255,255,.07);
    --shadow:0 12px 30px -12px rgba(0,0,0,.6);
    --frame:#050608; --frame-edge:#2a2e36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12; --panel:#141821; --panel-2:#1a1f2b; --ink:#e8ebf2; --muted:#98a1b3; --line:#252b39;
  --accent:#8b6bff; --accent-2:#2dd4bf;
  --wall:radial-gradient(120% 70% at 10% 0%,#3b2295 0,transparent 55%),radial-gradient(90% 60% at 100% 35%,#0b5d63 0,transparent 55%),radial-gradient(110% 60% at 40% 105%,#5a1746 0,transparent 60%),#0a0b12;
  --glass:rgba(20,23,33,.55); --glass-2:rgba(28,32,45,.86); --glass-line:rgba(255,255,255,.09);
  --w-ink:#eef1f7; --w-muted:#a2aabc; --w-soft:rgba(255,255,255,.07);
  --shadow:0 12px 30px -12px rgba(0,0,0,.6);
  --frame:#050608; --frame-edge:#2a2e36;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}

/* ---------- page chrome ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.ctl label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
.chk[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden;padding:36px 16px 40px}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12.5px;color:var(--muted);pointer-events:none;padding:0 16px}
.hint kbd{font:600 11px "JetBrains Mono",monospace;border:1px solid var(--line);background:var(--panel);padding:1px 5px;border-radius:5px}
.devlabel{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.devlabel b{color:var(--ink);font-weight:600}
.sizer{position:relative}
.device{position:absolute;left:0;top:0;transform-origin:0 0;padding:9px;border-radius:calc(var(--r) + 9px);background:var(--frame);box-shadow:0 0 0 1.5px var(--frame-edge),0 30px 80px -30px rgba(0,0,0,.55)}
.device.hand{padding:9px;border-radius:30px}
.screen{position:relative;overflow:hidden;border-radius:var(--r);background:#000;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.home,.pill{touch-action:none}
.nbody kbd{font:600 11px "JetBrains Mono",monospace;border:1px solid var(--line);background:var(--panel-2);padding:1px 5px;border-radius:5px}
.hinge{position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(transparent,rgba(255,255,255,.18) 20%,rgba(255,255,255,.18) 80%,transparent);z-index:60;pointer-events:none;mix-blend-mode:overlay}
/* handheld shell */
.grip{position:absolute;top:-30px;bottom:-30px;width:150px;background:linear-gradient(180deg,#2a2d35,#17191e);border-radius:60px;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 20px 50px -20px rgba(0,0,0,.6);z-index:-1}
.grip.l{left:-128px}.grip.r{right:-128px}
.stick{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a4f5a,#1c1e23);box-shadow:0 3px 0 #0c0d10}
.dpad{position:absolute;width:66px;height:66px}
.dpad button{position:absolute;width:22px;height:22px;background:#3a3e48;border-radius:4px;color:#aab;font-size:10px}
.dpad button:active,.abxy button:active{filter:brightness(1.6)}
.abxy{position:absolute;width:70px;height:70px}
.abxy button{position:absolute;width:24px;height:24px;border-radius:50%;background:#3a3e48;color:#fff;font-weight:700;font-size:11px}
.gbtn{position:absolute;font-size:9px;color:#8a8f9b;padding:3px 8px;border-radius:9px;background:#24272e}

/* notes panel */
aside.notes{border-left:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
.ntabs{position:sticky;top:0;background:var(--panel);z-index:2;padding:14px 18px 0;border-bottom:1px solid var(--line)}
.ntabs h2{margin:0 0 10px;font-size:15px;letter-spacing:-.01em}
.ntabs .seg{margin-bottom:10px}
.nbody{padding:16px 18px 40px;font-size:13.5px}
.nbody h3{font-size:13px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.nbody h3:first-child{margin-top:0}
.nbody p{margin:6px 0}
.nbody ul{margin:6px 0;padding-left:18px}
.nbody li{margin:4px 0}
.nbody code{font:12px "JetBrains Mono",monospace;background:var(--panel-2);padding:1px 4px;border-radius:4px;border:1px solid var(--line)}
.nbody table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.nbody th,.nbody td{text-align:left;vertical-align:top;padding:7px 6px;border-bottom:1px solid var(--line)}
.nbody th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;letter-spacing:.02em}
.tag.c{background:color-mix(in srgb,var(--android) 18%,transparent);color:var(--android)}
.tag.k{background:color-mix(in srgb,var(--linux) 18%,transparent);color:var(--linux)}
.tag.n{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel-2)}
.q b{display:block;margin-bottom:3px}
.q .rec{color:var(--muted);font-size:12.5px}
pre.owl{font:11.5px/1.5 "JetBrains Mono",monospace;background:#11131a;color:#d6d9e6;padding:10px 12px;border-radius:10px;overflow:auto;margin:8px 0}
pre.owl i{color:#8b6bff;font-style:normal}pre.owl u{color:#2dd4bf;text-decoration:none}pre.owl s{color:#e8a65b;text-decoration:none}

@media (max-width:1100px){
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:86vh;min-height:520px}
  aside.notes{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:600px){
  header.top,.ctl{padding:10px 16px}
  .stage{padding:16px 16px 34px}
}

/* ---------- inside the device ---------- */
.screen{color:var(--w-ink);font-size:13px}
.wall{position:absolute;inset:0;background:var(--wall)}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 70% 70%,rgba(255,255,255,.08),transparent)}
.layer{position:absolute;inset:0}
.sb{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:600;font-size:12.5px;z-index:40;pointer-events:none}
.sb .icons{display:flex;gap:5px;align-items:center}
.cam{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:#000;box-shadow:0 0 0 2px rgba(0,0,0,.4);z-index:41;left:50%;margin-left:-5.5px}
.pill{position:absolute;bottom:6px;left:50%;width:120px;height:5px;margin-left:-60px;border-radius:5px;background:var(--w-ink);opacity:.55;z-index:45;cursor:pointer}
.pill::before{content:"";position:absolute;inset:-12px -20px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.toast{position:absolute;left:50%;bottom:70px;transform:translate(-50%,20px);opacity:0;transition:.25s;z-index:80;padding:9px 14px;border-radius:14px;font-size:12px;font-weight:500;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* home */
.home{position:absolute;inset:30px 0 0;display:flex;flex-direction:column}
.pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;padding:10px 14px 0;overflow:hidden}
.wgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:var(--row);gap:10px;grid-auto-flow:row dense}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 6px}
.dots i{cursor:pointer;width:6px;height:6px;border-radius:3px;background:var(--w-ink);opacity:.25;transition:.2s}
.dots i.on{width:16px;opacity:.7}
.dock{margin:0 14px;padding:9px 12px;border-radius:24px;display:flex;justify-content:space-around}
.bar{margin:8px 14px 20px;height:44px;border-radius:22px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;color:var(--w-muted);cursor:text}
.bar .ph{flex:1;font-size:13px}
.bar .mic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}

/* widgets */
.w{position:relative;border-radius:20px;padding:12px 13px;overflow:hidden;container-type:size;min-width:0}
.w .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--w-muted);display:flex;align-items:center;gap:5px}
.w .lbl i{width:6px;height:6px;border-radius:50%;background:var(--accent-2);display:inline-block}
.w-clock .t{font-size:clamp(30px,26cqh,58px);font-weight:300;letter-spacing:-.04em;line-height:1}
.w-clock .d{font-weight:600;margin-top:4px;font-size:13px}
.w-clock .m{color:var(--w-muted);font-size:11.5px;margin-top:2px}
.w-clock.big{background:none;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding-left:6px}
.w-clock.big .t{font-size:clamp(40px,50cqh,76px);font-weight:200}
.w-weather .tmp{font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1.1;margin-top:3px}
.w-weather .s{font-size:11.5px;color:var(--w-muted)}
.spark{position:absolute;left:0;right:0;bottom:0;height:34%;opacity:.9}
.ring{position:relative;width:min(58cqh,40cqw);aspect-ratio:1;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700}
.kv{font-size:11.5px;color:var(--w-muted);line-height:1.6}
.kv b{color:var(--w-ink);font-weight:600}
.agenda{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.ev{display:flex;gap:8px;align-items:stretch;font-size:12px;line-height:1.25}
.ev i{width:3px;border-radius:2px;flex:none}
.ev small{display:block;color:var(--w-muted);font-size:10.5px}
.layers{display:flex;flex-direction:column;gap:4px;margin:7px 0}
.lay{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 7px;border-radius:7px;background:var(--w-soft)}
.lay i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.lay span{margin-left:auto;color:var(--w-muted);font-size:10.5px}
.mini-btn{font-size:11px;font-weight:600;padding:5px 10px;border-radius:9px;background:var(--accent);color:#fff}
.mini-btn.ghost{background:var(--w-soft);color:var(--w-ink)}
.w-media{display:flex;gap:12px;align-items:center}
.art{width:min(76cqh,40cqw);aspect-ratio:1;border-radius:14px;flex:none;background:linear-gradient(135deg,#ff5f8f,#7b3cff 60%,#1e3a8a);box-shadow:0 8px 20px -8px rgba(123,60,255,.6);position:relative;overflow:hidden}
.art::after{content:"";position:absolute;inset:30% -10% -40% 30%;border-radius:50%;background:rgba(255,255,255,.18)}
.prog{height:4px;border-radius:2px;background:var(--w-soft);margin:7px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--w-ink);border-radius:2px}
.mctl{display:flex;gap:14px;align-items:center}
.mctl .pp{width:30px;height:30px;border-radius:50%;background:var(--w-ink);color:var(--panel);display:grid;place-items:center}
.tgl{display:flex;justify-content:space-between;align-items:center;height:100%;gap:6px}
.tgl button{flex:1;height:100%;max-height:44px;border-radius:14px;display:grid;place-items:center;background:var(--w-soft);transition:.15s}
.tgl button.on{background:var(--accent);color:#fff}
.games{display:flex;gap:8px;margin-top:8px;height:calc(100% - 22px)}
.cover{flex:1;border-radius:12px;position:relative;overflow:hidden;min-width:0;display:flex;align-items:flex-end;padding:7px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);line-height:1.15}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55))}
.cover span{position:relative}
.agentmsg{font-size:12px;margin-top:6px;padding:8px 10px;border-radius:12px 12px 12px 4px;background:var(--w-soft)}
.agentin{margin-top:7px;font-size:11.5px;color:var(--w-muted);padding:7px 10px;border-radius:10px;border:1px dashed var(--glass-line)}
@container (max-height:90px){ .w-weather .spark{display:none} }
@container (max-width:150px){ .w-media .art{display:none} .agenda .ev:nth-child(n+3){display:none} }

/* edit mode */
.home.edit .w{animation:wig .5s ease-in-out infinite alternate;outline:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:-1px;cursor:grab}
.home.edit .w:nth-child(2n){animation-delay:-.25s}
@keyframes wig{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.wx,.wr{display:none;position:absolute;width:24px;height:24px;border-radius:50%;z-index:5;place-items:center;font-size:13px;font-weight:700}
.home.edit .wx,.home.edit .wr{display:grid}
.wx{top:6px;right:6px;background:var(--bad);color:#fff}
.wr{bottom:6px;right:6px;background:var(--accent);color:#fff}
.wsz{display:none;position:absolute;bottom:9px;left:10px;font:600 10px "JetBrains Mono",monospace;color:var(--accent);z-index:5}
.home.edit .wsz{display:block}
.home.edit .page{padding-top:54px}
.w.h1 .wx{top:50%;margin-top:-12px;right:36px}.w.h1 .wr{bottom:auto;top:50%;margin-top:-12px}.home.edit .w.h1 .wsz{display:none}
.w.drag-over{outline:2px solid var(--accent)!important}
.editbar{position:absolute;top:34px;left:12px;right:12px;z-index:30;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:16px;font-size:12px}
.editbar span{flex:1;color:var(--w-muted)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;border-radius:26px 26px 0 0;padding:10px 16px 24px;max-height:72%;overflow:auto;background:var(--glass-2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid var(--glass-line);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
@keyframes fade{from{opacity:0}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--w-ink);opacity:.25;margin:2px auto 10px}
.wlib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wlib button{text-align:left;padding:10px;border-radius:14px;background:var(--w-soft);font-size:12px}
.wlib button b{display:block;font-size:12.5px}
.wlib button small{color:var(--w-muted)}

/* tablet home */
.home.tab{flex-direction:row;inset:30px 0 0}
.rail{width:64px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;margin:8px 0 8px 10px;border-radius:22px}
.rail .sep{width:26px;height:1px;background:var(--glass-line);margin:2px 0}
.tabmain{flex:1;display:flex;flex-direction:column;min-width:0}
.tabmain .page{padding:8px 14px 0}

/* app icon */
.ico{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:500;min-width:0}
.ico .sq{width:var(--isz,46px);height:var(--isz,46px);border-radius:31%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:calc(var(--isz,46px)*.36);letter-spacing:-.03em;box-shadow:0 4px 12px -4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);position:relative}
.ico .nm{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--w-ink)}
.badge{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--panel);font-size:8px;font-weight:800;color:#fff}
.badge.a{background:var(--android)}
.badge.l{background:var(--linux)}
.ico.hl .sq{outline:2.5px solid var(--accent);outline-offset:3px}

/* drawer */
.ovl{position:absolute;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(10,10,20,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .2s}
.drawer{position:absolute;left:0;right:0;bottom:0;top:38px;border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding:8px 14px 0;background:var(--glass-2);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border-top:1px solid var(--glass-line);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.drawer.tab{left:50%;right:auto;width:560px;margin-left:-280px;top:60px;bottom:58px;border-radius:24px;border:1px solid var(--glass-line)}

<template id="n-p">
  <h3>Principles</h3>
  <ul>
    <li><b>Home is instant.</b> The home screen, widgets and drawer are native (Compose, from the Omalauncher fork) and draw before the PowOS session is up. Widgets that need PowOS show a placeholder until the session answers.</li>
    <li><b>One drawer, two worlds.</b> Android apps and PowOS apps (KDE, Flatpak, pacman) sit in one list, one search, one ranking. A small corner badge (<span class="tag c">A</span> Android, <span class="tag k">L</span> PowOS/Linux) tells them apart. The badge only affects how the app runs.</li>
    <li><b>Every window is a task.</b> A PowOS window and an Android app are the same thing to the user: a Recents card, splittable, floatable, closable.</li>
    <li><b>The form factor picks the layout.</b> The S25 and the folded Open use a 6-column grid, pages, a dock and the bar. The unfolded Open uses a 12-column grid, a side rail, a taskbar, split panes and floating windows. Plugging in a controller switches home to Game Mode.</li>
    <li><b>The bar does two jobs.</b> Typing searches apps. If no app matches, Enter sends the text to the PowOS agent (<code>powos ai manager</code>).</li>
    <li><b>Same look on every device.</b> Glass widgets over one wallpaper, one accent, light and dark. Game Mode is always dark, the same convention as Steam Big Picture and TV launchers.</li>
  </ul>
  <h3>Grid</h3>
  <p>Phone: 6 columns, about 10 rows per page, 2 pages. Unfolded: 12 columns on one page, packed with <code>grid-auto-flow: dense</code>, so phone layouts move over without a separate layout per device. Widget sizes use OWL's <code>W×H</code> format. In edit mode, the ⤡ button cycles through each widget's allowed sizes.</p>
</template>

<template id="n-g">
  <h3>Touch</h3>
  <table>
    <tr><th>Gesture</th><th>Result</th></tr>
    <tr><td>Swipe up from bottom edge</td><td>Home</td></tr>
    <tr><td>Swipe up from edge + hold</td><td>Overview (Recents)</td></tr>
    <tr><td>Swipe left/right on the pill</td><td>Previous/next app <span class="tag n">not mocked</span></td></tr>
    <tr><td>Swipe up on home, or tap the bar</td><td>App drawer (search focused when you tap the bar)</td></tr>
    <tr><td>Swipe down from top / on home</td><td>Notifications and quick settings</td></tr>
    <tr><td>Long-press a widget</td><td>Edit mode (move, resize, remove, add)</td></tr>
    <tr><td>Drag an overview card to a half (unfolded)</td><td>Split screen</td></tr>
    <tr><td>Drag the split divider</td><td>Resize panes</td></tr>
    <tr><td>Drag a window title bar</td><td>Move a floating window</td></tr>
  </table>
  <p>In the prototype, drag with the mouse inside the device. Click the pill to go home. Press and hold the pill to open the overview.</p>
  <h3>Controller (Game Mode)</h3>
  <table>
    <tr><th>Button</th><th>Keyboard here</th><th>Result</th></tr>
    <tr><td>D-pad / left stick</td><td><kbd>←↑→↓</kbd></td><td>Move focus</td></tr>
    <tr><td>A</td><td><kbd>Enter</kbd></td><td>Launch / select</td></tr>
    <tr><td>B</td><td><kbd>Esc</kbd></td><td>Back</td></tr>
    <tr><td>☰ / Guide</td><td><kbd>M</kbd></td><td>Quick menu (performance, overview, touch home)</td></tr>
  </table>
  <p>A real gamepad also works if the browser reports one (Gamepad API).</p>
</template>

<template id="n-o">
  <h3>Taken from Omalauncher (MIT)</h3>
  <ul>
    <li><b>The bar.</b> One input at the bottom of home that searches apps and also takes prompts. Enter opens the top match or sends the text to the agent. Hold the mic for voice.</li>
    <li><b>OWL widgets</b> on a 6-column grid with free sizes (<code>3x2</code>, <code>6x3</code>…). Widgets use live <code>cmd</code>/<code>stream</code>/<code>file</code>/<code>android.*</code> sources, can be edited on the phone, and come from a store. Here, the PowOS status, agent inbox and system widgets are OWL widgets with PowOS sources.</li>
    <li><b>Linux windows as Android tasks</b>, each with its own Recents card. This is the model for multitasking.</li>
    <li><b>Side rail</b> for pinned apps. Used here on the unfolded Open.</li>
    <li><b>Themes applied to launcher and guest together</b>, so KDE windows and the launcher share an accent and wallpaper.</li>
    <li>Usage-ranked suggestions in the drawer (<code>AppUsage</code>), and a dot on settings when an update is pending.</li>
  </ul>
  <pre class="owl"><i>widget</i> <s>"powos-status"</s> {
  <i>meta</i> { owl: 1; size: <s>"3x3"</s>; minSize: <s>"3x2"</s> }
  <i>source</i> st = <u>stream</u>(<s>"powos status --json --watch"</s>)
  <i>let</i> s = json(st)
  Column { gap: 4
    Text { text: <s>"PowOS · ${s.session}"</s> }
    Text { text: <s>"Sync ${ago(s.last_sync)}"</s>; color: s.sync_ok ? muted : red }
    Button { text: <s>"Sync now"</s>; on click: run(<s>"powos sync now"</s>) }
  }
}</pre>
  <h3>Not taken</h3>
  <p>Omalauncher's compositor (wlbridge, proot, its CPU <code>wl_shm</code> path) and its Omarchy-only themes. PowOS keeps KWin on Anland with the GPU path. See <code>powos-app-plan.md</code>.</p>

/* ================= interactions ================= */
function go(view){ S.view=view; S.gmenu=false; S.addSheet=false; if(view!=='home') S.edit=false; render(); }
function openApp(id){
  if(!A[id]) return;

    const w=S.win;
    if(w.focus==='b' && w.split) w.b=id; else if(w.split && w.b===id){} else w.a=id;
    if(w.split && w.a===w.b){ w.b = S.recents.find(x=>x!==w.a); }
  } else S.phoneApp=id;
  if(id==='steam' || id==='powstream' || id==='moonlight'){ }
  S.view='windows'; S.edit=false; S.addSheet=false; render();
  toast(A[id].src==='a' ? `${A[id].name}: Android task${form()==='tab'?' → KWin window via VirtualDisplay':''}` : `${A[id].name}: launched in the PowOS session (${A[id].kind})`);

function bind(){
  const scr=$('#screen');

      el.ondrop=e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain'),to=+el.dataset.wi;if(from===to)return;const W=S.widgets;const fp=W[from].p;W[from].p=W[to].p;W[to].p=fp;[W[from],W[to]]=[W[to],W[from]];render();};
    });

      z.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');splitWith(id,z.dataset.dz);};
    });
  }
  // pages dots
  const pg=$('#pages');
  if(pg){ let wl=0; pg.onwheel=e=>{ if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return; e.preventDefault(); if(Date.now()-wl<450||Math.abs(e.deltaY)<15) return; wl=Date.now(); const i=Math.round(pg.scrollLeft/pg.clientWidth)+(e.deltaY>0?1:-1); pg.scrollTo({left:pg.clientWidth*Math.max(0,Math.min(1,i)),behavior:'smooth'}); };
    pg.onscroll=()=>{const i=Math.round(pg.scrollLeft/pg.clientWidth);scr.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i));}; if(S.page){pg.scrollLeft=pg.clientWidth*S.page;} }
  scr.querySelectorAll('.ovtrack').forEach(el=>{ el.onwheel=e=>{ if(getComputedStyle(el).display==='grid') return; if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ el.scrollLeft+=e.deltaY; e.preventDefault(); } }; });
  // divider drag
  const dv=$('#divider');
  if(dv){ dv.onpointerdown=e=>{e.stopPropagation();dv.setPointerCapture(e.pointerId);const panes=$('#panes').getBoundingClientRect();const sc=panes.width/$('#panes').offsetWidth;
    dv.onpointermove=m=>{S.win.ratio=Math.max(.25,Math.min(.75,(m.clientX-panes.left)/panes.width));const ps=scr.querySelectorAll('.pane');ps[0].style.flex=`0 0 calc(${S.win.ratio*100}% - 7px)`;ps[1].style.flex=`0 0 calc(${(1-S.win.ratio)*100}% - 7px)`;};
    dv.onpointerup=()=>{dv.onpointermove=null;}; }; }
  // floating window move/resize
  scr.querySelectorAll('.float').forEach(f=>{
    const i=+f.dataset.fi, arr= form()==='tab'?S.win.floats:S.phoneFloats, st=arr[i];
    const scale=()=>f.getBoundingClientRect().width/f.offsetWidth;
    const tb=f.querySelector('.wtitle');
    tb.onpointerdown=e=>{ if(e.target.closest('button'))return; e.stopPropagation(); tb.setPointerCapture(e.pointerId); const s=scale(),sx=e.clientX,sy=e.clientY,ox=st.x,oy=st.y; if(form()==='tab'){S.win.focus='f'+i;}
      tb.onpointermove=m=>{st.x=ox+(m.clientX-sx)/s;st.y=Math.max(0,oy+(m.clientY-sy)/s);f.style.left=st.x+'px';f.style.top=st.y+'px';};
      tb.onpointerup=()=>{tb.onpointermove=null;}; };
    const rs=f.querySelector('.rs');
    rs.onpointerdown=e=>{e.stopPropagation();rs.setPointerCapture(e.pointerId);const s=scale(),sx=e.clientX,sy=e.clientY,ow=st.w,oh=st.h;
      rs.onpointermove=m=>{st.w=Math.max(180,ow+(m.clientX-sx)/s);st.h=Math.max(130,oh+(m.clientY-sy)/s);f.style.width=st.w+'px';f.style.height=st.h+'px';};
      rs.onpointerup=()=>{rs.onpointermove=null;};};
  });
  bindGestures(scr);
}
function splitWith(id,side){
  const w=S.win; w.split=true;
  if(side==='a'){ if(w.b===id) w.b=w.a; w.a=id; } else { if(w.a===id) w.a=w.b; w.b=id; }
  if(w.a===w.b) w.b=S.recents.find(x=>x!==w.a);
  w.floats=w.floats.filter(f=>f.app!==id); w.focus=side;
  S.recents=[id,...S.recents.filter(x=>x!==id)];
  go('windows'); toast(`${A[id].name} → ${side==='a'?'left':'right'} half`);
}
function floatApp(id){
  if(form()==='tab'){
    const w=S.win; if(w.a===id && w.split){ w.a=w.b; w.split=false; } else if(w.b===id){ w.split=false; }
    else if(w.a===id){ w.a=S.recents.find(x=>x!==id && !w.floats.some(f=>f.app===x)); }
    if(!w.floats.some(f=>f.app===id)) w.floats.push({app:id,x:200+w.floats.length*30,y:60+w.floats.length*30,w:300,h:220});
    w.focus='f'+(w.floats.length-1);
  } else {
    if(S.phoneApp===id) S.phoneApp=S.recents.find(x=>x!==id);
    if(!S.phoneFloats.some(f=>f.app===id)) S.phoneFloats.push({app:id,x:40,y:120+S.phoneFloats.length*40,w:250,h:300});
  }
  go('windows');
}
function onClick(e){
  const t=e.target.closest('[data-open],[data-act],[data-tog],[data-cat],[data-srcf],[data-wdel],[data-wsize],[data-wadd],[data-rclose],[data-split],[data-float],[data-ndel],[data-wclose],[data-wfloat],[data-wmin],[data-pane],[data-g],[data-pad]');
  if(S.longFired){ S.longFired=false; return; }
  const pgd=e.target.closest('[data-pg]'); if(pgd){ const pg=$('#pages'); pg.scrollTo({left:pg.clientWidth*+pgd.dataset.pg,behavior:'smooth'}); return; }
  if(!t) return;
  const ds=t.dataset;
  if(S.edit && t.closest('.w') && !ds.wdel && !ds.wsize) return;
  if(ds.pad){ pad(ds.pad); return; }
  if(ds.g){ gameActivate(t); return; }
  if(ds.open){ e.stopPropagation(); if(t.closest('.card')){ openApp(ds.open); return;} openApp(ds.open); return; }
  if(ds.tog){ S.t[ds.tog]^=1; if(ds.tog==='game'&&S.t.game){ go('game'); return;} render(); return; }
  if(ds.cat){ S.cat=ds.cat; render(); return; }
  if(ds.srcf){ S.srcf=ds.srcf; render(); return; }
  if(ds.wdel){ S.widgets.splice(+ds.wdel,1); render(); return; }
  if(ds.wsize){ const w=S.widgets[+ds.wsize], sz=WDEF[w.id].sizes; const k=sz.findIndex(s=>s[0]===w.w&&s[1]===w.h); const n=sz[(k+1)%sz.length]; w.w=n[0]; w.h=n[1]; render(); return; }
  if(ds.wadd){ if(!S.widgets.some(w=>w.id===ds.wadd)){ const s=WDEF[ds.wadd].sizes[0]; S.widgets.push({id:ds.wadd,w:s[0],h:s[1],p:1}); } S.addSheet=false; S.page=form()==='phone'?1:0; render(); S.page=0; toast(`${WDEF[ds.wadd].name} added`); return; }
  if(ds.rclose){ e.stopPropagation(); S.recents=S.recents.filter(x=>x!==ds.rclose); render(); return; }
  if(ds.split){ splitWith(ds.split,'b'); return; }
  if(ds.float){ floatApp(ds.float); return; }
  if(ds.ndel){ S.notifs.splice(+ds.ndel,1); render(); return; }
  if(ds.wclose){ closeWin(ds.wclose); return; }
  if(ds.wfloat){ const k=ds.wfloat; if(k.startsWith('f')){ const i=+k.slice(1); const arr=form()==='tab'?S.win.floats:S.phoneFloats; const f=arr.splice(i,1)[0]; if(form()==='tab'){ if(S.win.split) S.win.b=f.app; else { S.win.split=true; S.win.b=f.app; } S.win.focus='b'; } else S.phoneApp=f.app; render(); } else floatApp(S.win[k]); return; }
  if(ds.wmin){ closeWin(ds.wmin,true); return; }
  if(ds.pane){ if(S.win.focus!==ds.pane){S.win.focus=ds.pane; render();} return; }
  switch(ds.act){
    case 'bar': S.focusQ=true; S.q=''; go('drawer'); break;
    case 'drawer': S.q=''; go('drawer'); break;
    case 'home': go('home'); break;
    case 'back': go(S.prevView&&S.prevView!=='shade'?S.prevView:'home'); break;
    case 'windows': go('windows'); break;
    case 'shade': S.prevView=S.view; go('shade'); break;
    case 'clear': S.recents=[]; render(); break;
    case 'nclear': S.notifs=[]; render(); break;
    case 'done': S.edit=false; render(); break;
    case 'addw': S.addSheet=true; render(); break;
    case 'closesheet': S.addSheet=false; render(); break;
    case 'play': S.playing=!S.playing; render(); break;
    case 'prev': case 'next': toast(ds.act==='next'?'Next track':'Previous track'); break;
    case 'sync': toast('powos sync now · custom layer synced'); break;
    case 'gamemode': go('game'); break;
    case 'ask': S.focusQ=true; go('drawer'); break;
    case 'askq': toast(`→ powos ai manager: “${S.q.trim()}”`); break;
    case 'install': toast(`Searching Flathub, pacman and Play for “${S.q.trim()}”…`); break;
    case 'gmenu': S.gmenu=false; render(); break;
  }
}
function closeWin(k,min){
  if(k.startsWith('f')){ const arr=form()==='tab'?S.win.floats:S.phoneFloats; arr.splice(+k.slice(1),1); S.win.focus='a'; render(); return; }
  if(form()!=='tab'){ go('home'); return; }
  const w=S.win; const id=w[k];
  if(!min) S.recents=S.recents.filter(x=>x!==id);
  if(w.split){ if(k==='a') w.a=w.b; w.split=false; w.b=null; w.focus='a'; render(); }
  else go('home');
}

/* gestures: edge swipes, pill tap/hold, long-press widgets */
function bindGestures(scr){
  let st=null, holdT=null, longT=null;
  scr.onpointerdown=e=>{
    if(S.view==='game') return;
    const r=scr.getBoundingClientRect(), s=r.height/scr.offsetHeight;
    const y=(e.clientY-r.top)/s, h=scr.offsetHeight;
    const zone = y<34?'top': (y>h-26||e.target.id==='pill')?'bottom':'mid';
    if(e.target.closest('input,.wtitle,.divider,.rs,.dsearch,.chips,.taskbar,.dock')) { if(zone!=='bottom') return; }
    S.longFired=false;
    st={x:e.clientX,y:e.clientY,zone,s,t:Date.now(),moved:false,over:false};
    if(zone==='bottom'){
      holdT=setTimeout(()=>{ if(st){ st.over=true; S.prevView=S.view; go('overview'); } },420);
    }
    const w=e.target.closest('.w');
    if(w && !S.edit && S.view==='home'){ longT=setTimeout(()=>{ if(st&&!st.moved){ S.edit=true; S.longFired=true; render(); toast('Edit mode: drag, resize or remove widgets'); } },520); }
  };
  scr.onpointermove=e=>{ if(!st) return; const dy=(e.clientY-st.y)/st.s, dx=(e.clientX-st.x)/st.s; if(Math.abs(dy)>8||Math.abs(dx)>8){ st.moved=true; clearTimeout(longT); } if(st.zone==='bottom' && Math.abs(dx)>30 && Math.abs(dy)<20) clearTimeout(holdT); };
  scr.onpointerup=e=>{
    clearTimeout(holdT); clearTimeout(longT); if(!st) return;
    const dy=(e.clientY-st.y)/st.s, dx=(e.clientX-st.x)/st.s, z=st.zone, over=st.over; st=null;
    if(over) return;
    if(z==='bottom'){ if(dy<-20 || Math.abs(dy)<6&&Math.abs(dx)<6){ if(S.view!=='home'||S.edit){ S.edit=false; go('home'); } } return; }
    if(z==='top' && dy>40){ S.prevView=S.view; go('shade'); return; }
    if(Math.abs(dx)>Math.abs(dy)) return;
    if(S.view==='home' && !S.edit){ if(dy<-70){ S.q=''; go('drawer'); } else if(dy>70){ S.prevView='home'; go('shade'); } }
    else if(S.view==='drawer' && dy>120 && !document.activeElement?.matches('#q')){ go('home'); }
    else if(S.view==='shade' && dy<-70){ go(S.prevView||'home'); }
  };
  scr.onpointercancel=()=>{clearTimeout(holdT);clearTimeout(longT);st=null;};
}

/* ================= game focus ================= */
function rows(){ return [...document.querySelectorAll('#game .grow')].map(r=>[...r.querySelectorAll('.gf')]); }
function applyGameFocus(scroll=true){
  const R=rows(); if(!R.length) return;
  S.gf.r=Math.max(0,Math.min(R.length-1,S.gf.r));
  const row=R[S.gf.r]; const c=Math.max(0,Math.min(row.length-1,S.gf.c[S.gf.r]||0)); S.gf.c[S.gf.r]=c;
  document.querySelectorAll('#game .gf.focus').forEach(x=>x.classList.remove('focus'));
  const el=row[c]; el.classList.add('focus');
  const tr=el.parentElement, gs=$('#gscroll'), rowEl=el.closest('.grow'), b=scroll?'smooth':'auto';
  tr.scrollTo({left:Math.max(0, el.offsetLeft - tr.clientWidth/2 + el.offsetWidth/2),behavior:b});
  gs.scrollTo({top:Math.max(0, rowEl.offsetTop - gs.clientHeight/2 + rowEl.offsetHeight/2),behavior:b});
}
function gameActivate(el){
  const R=rows(); R.forEach((row,ri)=>{const ci=row.indexOf(el); if(ci>=0){S.gf.r=ri;S.gf.c[ri]=ci;}}); applyGameFocus();
  const [k,v]=el.dataset.g.split(':');
  if(v==='Touch home'){ S.t.game=0; if(S.dev==='hand') S.dev='s25'; go('home'); return; }
  const msg={play:`Launching ${v} · KWin fullscreen, controller captured`,stream:`PowStream → ${v} · connecting to PowStation…`,wake:`Wake-on-LAN sent to ${v}`,sys:`${v}`}[k];
  toast(msg);
}
function pad(b){
  const vv = S.dev==='hand'&&S.view==='home'?'game':S.view;
  if(b==='guide'){ go(vv==='game'?'overview':'game'); return; }
  if(vv!=='game'){ if(b==='b') go(S.dev==='hand'?'game':'home'); return; }
  if(S.gmenu){ if(b==='b'||b==='menu'){S.gmenu=false;render();} return; }
  const R=rows();
  if(b==='up'){ S.gf.r--; applyGameFocus(); }
  else if(b==='down'){ S.gf.r++; applyGameFocus(); }
  else if(b==='left'){ S.gf.c[S.gf.r]=(S.gf.c[S.gf.r]||0)-1; applyGameFocus(); }
  else if(b==='right'){ S.gf.c[S.gf.r]=(S.gf.c[S.gf.r]||0)+1; applyGameFocus(); }
  else if(b==='a'){ const el=document.querySelector('#game .gf.focus'); if(el) gameActivate(el); }
  else if(b==='b'){ if(S.dev!=='hand') go('home'); else toast('Already at Game Mode home'); }
  else if(b==='menu'){ S.gmenu=true; render(); }
  else if(b==='y'){ toast('Search library…'); }
  else if(b==='x'){ toast('Options: ' + (document.querySelector('#game .gf.focus')?.dataset.g.split(':')[1]||'')); }
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input')) { if(e.key==='Escape'){ go('home'); } return; }
  const vv = S.dev==='hand'&&S.view==='home'?'game':S.view;
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'a',Escape:'b',m:'menu',M:'menu',y:'y',x:'x'};
  if(vv==='game' && map[e.key]){ e.preventDefault(); pad(map[e.key]); return; }
  if(e.key==='Escape' && vv!=='home'){ S.edit=false; go('home'); }
});
/* real gamepad (if present) */
let gpPrev={};
function pollPad(){
  const gps=navigator.getGamepads?navigator.getGamepads():[]; const g=[...gps].find(Boolean);
  if(g){ const m={12:'up',13:'down',14:'left',15:'right',0:'a',1:'b',3:'y',2:'x',9:'menu',16:'guide'};
    for(const k in m){ const p=g.buttons[k]&&g.buttons[k].pressed; if(p&&!gpPrev[k]) pad(m[k]); gpPrev[k]=p; }
    requestAnimationFrame(pollPad); }
}
window.addEventListener('gamepadconnected',()=>{ toast('Controller connected → Game Mode'); go('game'); pollPad(); });

/* ================= page chrome wiring ================= */
document.getElementById('devSeg').onclick=e=>{const b=e.target.closest('[data-dev]');if(!b)return;const was=S.dev;S.dev=b.dataset.dev;
  if(S.dev==='hand'&&S.view==='home') S.view='game';
  if(was==='hand'&&S.view==='game'&&S.dev!=='hand') S.view='home';
  render(); if((was==='fold'&&S.dev==='open')||(was==='open'&&S.dev==='fold')) toast(S.dev==='open'?'Unfolded: 12-col grid, rail, taskbar, split':'Folded: cover layout, 6-col grid');};
document.getElementById('viewSeg').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;const v=b.dataset.view; if(v==='shade') S.prevView=S.view; if(v==='drawer') S.q=''; go(v==='home'&&S.dev==='hand'?'game':v); if(v==='home'&&S.dev==='hand') toast('Controller attached: Game Mode is home. ⊞ → Touch home leaves it.');};
document.getElementById('editBtn').onclick=()=>{S.edit=!S.edit; S.view='home'; if(S.dev==='hand') S.dev='s25'; render();};
document.getElementById('tbBtn').onclick=()=>{S.taskbar=!S.taskbar; render();};
document.getElementById('themeSeg').onclick=e=>{const b=e.target.closest('[data-theme-set]');if(!b)return;S.theme=b.dataset.themeSet;
  if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',S.theme);
  document.querySelectorAll('#themeSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  try{localStorage.setItem('powos-launcher-theme',S.theme);}catch(_){}};
function showNote(k){S.note=k;$('#nbody').innerHTML=document.getElementById('n-'+k).innerHTML;document.querySelectorAll('#noteSeg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.n===k));}
document.getElementById('noteSeg').onclick=e=>{const b=e.target.closest('[data-n]');if(b)showNote(b.dataset.n);};
document.getElementById('device').addEventListener('click',e=>{const p=e.target.closest('[data-pad]');if(p&&!e.target.closest('#screen')){pad(p.dataset.pad);}});
try{const th=localStorage.getItem('powos-launcher-theme');if(th&&th!=='auto'){const b=document.querySelector(`[data-theme-set="${th}"]`);b&&b.click();}}catch(_){}
window.addEventListener('resize',fit); try{ new ResizeObserver(()=>fit()).observe(document.getElementById('stage')); document.fonts&&document.fonts.ready.then(fit); }catch(_){}
setInterval(()=>{const n=now();document.querySelectorAll('.t-time').forEach(x=>x.textContent=n.t);},20000);
showNote('p');
/* deep link: #dev=open&view=windows&edit=1 */
try{const h=new URLSearchParams(location.hash.slice(1)); if(DEV[h.get('dev')]) S.dev=h.get('dev'); if(VIEWS.some(v=>v[0]===h.get('view'))) S.view=h.get('view'); if(h.get('edit')==='1') S.edit=true; if(h.get('theme')){ const b=document.querySelector(`[data-theme-set="${h.get('theme')}"]`); b&&b.click(); }}catch(_){}
render();
})();
</script>
</body>
