// PowOS engine: Andromarchy's Android side (display daemon + consumer, session service, rootfs installer,
// lotfix-run launcher), as a library inside the PowOS app. From lotfibennour/andromarchy @ 220754d (apk/),
// GPL-3.0, itself based on lfdevs/anland-termux (GPL-3.0, see LICENSE-anland-termux / UPSTREAM-anland-termux.txt).
// Changes from upstream: com.android.library instead of an app; native sources vendored under native-src/.
plugins {
    id "com.android.library"
}

android {
    namespace = "andro.marchy" // Java package of the imported code, kept: the JNI symbols are named after it
    compileSdk = 37

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    defaultConfig {
        // The Andromarchy native code needs API 30 (memfd_create). The app's targetSdk is 28 (exec from app data).
        minSdk = 30
        // The imported code also has a "compatible" transport (Binder bridge from a separate Termux); here the
        // daemon runs in this app, so the display connects to its socket directly.
        buildConfigField "boolean", "COMPATIBLE", "false"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none", "-DANDROID_PLATFORM=android-30"
            }
        }
    }

    ndkVersion = "28.2.13676358"

    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
        }
    }

    lint {
        // Imported code calls API 30+ methods behind runtime checks; targetSdk 28 is deliberate.
        abortOnError = false
    }
}

// Executables the app runs, built with the NDK and shipped as lib*.so so that Android extracts them to the
// executable nativeLibraryDir: the display daemon, lotfix-run (the Arch launcher) and the termux-va video daemon.
// Entries starting with "-" are compiler/linker flags. 16 KB-aligned segments for 16 KB-page devices.
def jniOut = file("src/main/jniLibs/arm64-v8a")
def executables = [
    "libandromarchy.so": ["native/andromarchy/andromarchy.c", "native/andromarchy/common/socket_utils.c"],
    "liblotfixrun.so"  : ["native-src/launcher/lotfix-run.c"],
    // termux-va (lfdevs, GPL-3.0): MediaCodec hardware video for the VA-API of Mesa's termuxva bridge
    "libtermuxva.so"   : ["native-src/third_party/termux-va/daemon/termux-va.c", "-std=c11",
                          "-Inative-src/third_party/termux-va/common", "-lmediandk", "-llog", "-landroid"],
]
tasks.register("buildExecutables") {
    inputs.files(executables.values().flatten().findAll { !it.startsWith("-") })
    outputs.dir(jniOut)
    def ndkDir = androidComponents.sdkComponents.ndkDirectory
    doLast {
        def os = System.getProperty("os.name").toLowerCase()
        // The NDK ships x86_64 Linux and universal macOS host tools (on an arm64 Linux builder they run
        // under Rosetta/binfmt).
        def host = os.contains("windows") ? "windows-x86_64" : os.contains("mac") ? "darwin-x86_64" : "linux-x86_64"
        def clang = "${ndkDir.get().asFile}/toolchains/llvm/prebuilt/${host}/bin/aarch64-linux-android30-clang" +
                    (host == "windows-x86_64" ? ".cmd" : "")
        jniOut.mkdirs()
        executables.each { name, srcs ->
            def args = srcs.collect {
                it.startsWith("-I") ? "-I" + file(it.substring(2)).path : it.startsWith("-") ? it : file(it).path
            }
            def proc = ([clang, "-O2", "-Wall", "-pie", "-Wl,-z,max-page-size=16384",
                         "-o", new File(jniOut, name).path] + args).execute()
            proc.waitForProcessOutput(System.out, System.err)
            if (proc.exitValue() != 0)
                throw new GradleException("NDK build of ${name} failed")
        }
    }
}
tasks.named("preBuild") { dependsOn("buildExecutables") }
