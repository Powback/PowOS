# How the full PowOS Android rootfs (out/powos-rootfs.tar.gz, build-rootfs.sh) splits for phones without root:
# a base image they download first (out/powos-rootfs-base.tar.gz) and packs the PowOS app adds on demand
# (out/powos-pack-<name>.tar.gz; engine Packs.java). tools/split-rootfs.py applies it; the rooted path keeps the full
# rootfs, unchanged. Paths are relative to /, shell globs (fnmatch: * also crosses /). First matching line wins.
#
#   keep  <glob...>              stays in the base (exceptions to the lines below it)
#   drop  <glob...>              not on a phone at all: left out of the base and every pack, and added to the base's
#                                pacman.conf NoExtract so package updates don't bring it back
#   pack  <name> path <glob...>  goes to pack <name>
#   roots <pkg...>               day one: these packages and everything they depend on (pacman's dependencies)
#                                stay in the base; with roots, packages outside that closure go to the packs
#   pack  <name> pkg <pkg...>    these packages, plus their dependencies outside the base and earlier packs, go to
#                                pack <name> (a package named here leaves the base even when a root depends on it)
#   pack  <name> rest            every package left over goes to pack <name>
#
# Files go: keep/drop first, then the owning package's pack, then the path pack rules, else the base.
#
# Measured 2026-11-03 on the 10-26 full rootfs (7.07 GB gz, 15.9 GiB unpacked): FEX's x86 rootfs 2.67 GiB, the Steam
# bootstrap tarball 1.39 GiB (already compressed), glibc's compiled locales 0.95 GiB, docs/man/help 0.45 GiB, Brave
# 0.42, MariaDB 0.44, Noto CJK 0.29, Plasma's wallpapers 0.29 (the default, Next, is breeze's: it stays), SpacetimeDB
# 0.17 GiB. Split: base 1.03 GB gz, gaming 2.75, apps 2.20, dev 0.23, languages 0.59.

# The English and C locales every session needs.
keep usr/share/locale/locale.alias usr/share/locale/en/* usr/share/locale/en_US/* usr/share/locale/en_GB/*
keep usr/lib/locale/C.* usr/lib/locale/en_US* usr/lib/locale/locale-archive usr/share/qt6/translations/*_en.qm
# The scripts that start gaming stay in the base: without the pack they ask the app to add it (play/powos-steam).
keep usr/bin/powos-play usr/bin/powos-steam

# Documentation nobody reads on a phone (Help menus open the web instead).
drop usr/share/ublue-os/docs/* usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/* usr/share/help/* usr/lib/debug/*

# What the first start needs: the Plasma session on Android (install-powos-android.sh's own list, our packages),
# the PowOS widgets' QML (desktop/plasmoid: kirigami, plasma, QMLTermWidget), the PowOS CLI and terminal, sound,
# pacman to add the rest. Everything else of the image is in a pack.
roots base filesystem pacman sudo bash coreutils util-linux findutils grep sed gawk tar gzip zstd xz bzip2 which file
roots procps-ng psmisc iproute2 inetutils curl wget ca-certificates openssh git jq python python-gobject sqlite less nano
roots plasma-workspace plasma-desktop kwin kglobalacceld xwayland-kgsl xdg-desktop-portal-kde kscreen breeze breeze-icons
roots kirigami kirigami-addons libplasma plasma5support qqc2-desktop-style qqc2-breeze-style kdeplasma-addons
roots plasma-pa powerdevil konsole dolphin systemsettings qmltermwidget pyside6 scrcpy android-tools
roots mesa vulkan-freedreno vulkan-icd-loader vulkan-tools pipewire pipewire-pulse pipewire-jack pipewire-alsa wireplumber
roots fontconfig noto-fonts noto-fonts-emoji ttf-dejavu ttf-liberation xorg-xwayland xdg-utils shared-mime-info
# first-session.sh sets up Flathub (PowOS installs its Flatpaks per user).
roots flatpak
# The no-root engine runs every Linux program through lotfix-run: fakechroot (LD_PRELOAD libfakechroot.so) + fakeroot.
# Without them in the base nothing of the image starts on a phone without root (11-04 emulator: "sleep: command not found").
roots fakechroot fakeroot

# Gaming: Steam (Valve's client bootstrap + Game Mode), FEX with its x86 rootfs, box64, the launchers.
pack gaming path usr/share/fex-emu/* usr/share/gamescope-session-plus/*
pack gaming pkg fex-emu box64 steam gamescope lutris mangohud umu-launcher steamos-manager-powerstation steam-notif-daemon gamemode-news-hook

# Apps people open later, and developer tools.
pack apps pkg brave-origin-bin spacetimedb mariadb mariadb-clients plasma-workspace-wallpapers qt6-webengine
# Homebrew's bottle archive (the image unpacks it on first `brew`).
pack apps path usr/share/homebrew.tar.zst
pack dev pkg gcc cmake meson ninja boost binutils gdb vulkan-headers linux-api-headers python-pip uv base-devel

# Languages other than English: app translations and glibc's compiled locales. The app adds it at install when
# Android's language isn't English.
pack languages pkg noto-fonts-cjk glibc-locales
pack languages path usr/share/locale/* usr/lib/locale/* usr/share/qt6/translations/*

# Everything else of the image: added from Settings > Storage, or by an app's first start.
pack apps rest
