# How the full PowOS Android rootfs (out/powos-rootfs.tar.gz, build-rootfs.sh) splits for phones without root:
# a base image they download first (out/powos-rootfs-base.tar.gz) and packs the PowOS app adds on demand
# (out/powos-pack-<name>.tar.gz; engine Packs.java). tools/split-rootfs.py applies it; the rooted path keeps the full
# rootfs, unchanged. Paths are relative to /, shell globs (fnmatch: * also crosses /). First matching line wins.
#
#   keep  <glob...>              stays in the base (exceptions to the lines below it)
#   drop  <glob...>              not on a phone at all: left out of the base and every pack, and added to the base's
#                                pacman.conf NoExtract so package updates don't bring it back
#   pack  <name> path <glob...>  goes to pack <name>
#   roots <pkg...>               day one: these packages and everything they depend on (pacman's dependencies)
#                                stay in the base; with roots, packages outside that closure go to the packs
#   pack  <name> pkg <pkg...>    these packages, plus their dependencies outside the base and earlier packs, go to
#                                pack <name> (a package named here leaves the base even when a root depends on it)
#   pack  <name> rest            every package left over goes to pack <name>
#
# Files go: keep/drop first, then the owning package's pack, then the path pack rules, else the base.
#
# Measured 2026-11-03 on the 10-26 full rootfs (7.07 GB gz, 15.9 GiB unpacked): FEX's x86 rootfs 2.67 GiB, the Steam
# bootstrap tarball 1.39 GiB (already compressed), glibc's compiled locales 0.95 GiB, docs/man/help 0.45 GiB, Brave
# 0.42, MariaDB 0.44, Noto CJK 0.29, Plasma's wallpapers 0.29 (the default, Next, is breeze's: it stays), SpacetimeDB
# 0.17 GiB. Split: base 1.03 GB gz, gaming 2.75, apps 2.20, dev 0.23, languages 0.59.

# The English and C locales every session needs.
keep usr/share/locale/locale.alias usr/share/locale/en/* usr/share/locale/en_US/* usr/share/locale/en_GB/*
keep usr/lib/locale/C.* usr/lib/locale/en_US* usr/lib/locale/locale-archive usr/share/qt6/translations/*_en.qm
# The scripts that start gaming stay in the base: without the pack they ask the app to add it (play/powos-steam).
keep usr/bin/powos-play usr/bin/powos-steam

# Documentation nobody reads on a phone (Help menus open the web instead).
drop usr/share/ublue-os/docs/* usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/* usr/share/help/* usr/lib/debug/*

# What Steam downloads itself (11-07 decision: no Proton/compat tools or Steam client in the image or packs).
# gamescope-session-plus's bootstrap_steam.tar.gz (1.42 GB of the 2.75 GB gaming pack) is Bazzite's pre-seeded x86
# Steam client + sniper runtime for the Deck's Game Mode; on the phone powos-steam runs Valve's ARM64 client, which
# downloads and updates itself (pkgs/steam). Proton: Steam (or `powos-play --install-proton`) downloads it, and the
# steam package's arm64 gate/overlay find it by capability (version-proof), so nothing of it ships here.
drop usr/share/gamescope-session-plus/bootstrap_steam.tar.gz
# FEX's x86 RootFS (Fedora, 2.7 GiB) keeps what x86 games load: glibc, Mesa (gallium + libLLVM, x86 Turnip =
# libvulkan_freedreno), SDL, audio. Out: the LLVM/clang toolchain and its libclang (only Rusticl and the tools link
# it; libgallium needs libLLVM alone), OpenCL, the Vulkan drivers and layers of GPUs a phone doesn't have (Intel,
# AMD, NVIDIA, Mali, Apple, PowerVR, Broadcom, virtio, D3D12, lavapipe), headers, docs, translations, the rpm db.
drop usr/share/fex-emu/RootFS/*/usr/include/* usr/share/fex-emu/RootFS/*/usr/share/doc/* usr/share/fex-emu/RootFS/*/usr/share/man/*
drop usr/share/fex-emu/RootFS/*/usr/share/info/* usr/share/fex-emu/RootFS/*/usr/share/locale/* usr/share/fex-emu/RootFS/*/var/log/*
drop usr/share/fex-emu/RootFS/*/usr/lib/sysimage/rpm/* usr/share/fex-emu/RootFS/*/var/cache/*
drop usr/share/fex-emu/RootFS/*/usr/bin/llvm-* usr/share/fex-emu/RootFS/*/usr/bin/clang* usr/share/fex-emu/RootFS/*/usr/bin/c-index-test
drop usr/share/fex-emu/RootFS/*/usr/bin/lld usr/share/fex-emu/RootFS/*/usr/bin/lli* usr/share/fex-emu/RootFS/*/usr/bin/opt usr/share/fex-emu/RootFS/*/usr/bin/llc
drop usr/share/fex-emu/RootFS/*/usr/bin/bindgen usr/share/fex-emu/RootFS/*/usr/bin/bugpoint usr/share/fex-emu/RootFS/*/usr/bin/dsymutil
drop usr/share/fex-emu/RootFS/*/usr/bin/diagtool usr/share/fex-emu/RootFS/*/usr/bin/FileCheck usr/share/fex-emu/RootFS/*/usr/bin/sancov
drop usr/share/fex-emu/RootFS/*/usr/bin/cmake usr/share/fex-emu/RootFS/*/usr/bin/ctest usr/share/fex-emu/RootFS/*/usr/bin/cpack usr/share/fex-emu/RootFS/*/usr/bin/ccmake
drop usr/share/fex-emu/RootFS/*/usr/lib*/libclang* usr/share/fex-emu/RootFS/*/usr/lib*/libRusticlOpenCL* usr/share/fex-emu/RootFS/*/etc/OpenCL/*
drop usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_intel* usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_radeon* usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_nouveau*
drop usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_panfrost* usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_asahi* usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_powervr*
drop usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_broadcom* usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_virtio* usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_dzn*
drop usr/share/fex-emu/RootFS/*/usr/lib*/libvulkan_lvp* usr/share/fex-emu/RootFS/*/usr/lib*/libVkLayer_khronos_validation*
drop usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/intel_* usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/radeon_* usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/nouveau_*
drop usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/panfrost_* usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/asahi_* usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/powervr_*
drop usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/broadcom_* usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/virtio_* usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/dzn_*
drop usr/share/fex-emu/RootFS/*/usr/share/vulkan/icd.d/lvp_* usr/share/fex-emu/RootFS/*/usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation*

# What the first start needs: the Plasma session on Android (install-powos-android.sh's own list, our packages),
# the PowOS widgets' QML (desktop/plasmoid: kirigami, plasma, QMLTermWidget), the PowOS CLI and terminal, sound,
# pacman to add the rest. Everything else of the image is in a pack.
roots base filesystem pacman sudo bash coreutils util-linux findutils grep sed gawk tar gzip zstd xz bzip2 which file
roots procps-ng psmisc iproute2 inetutils curl wget ca-certificates openssh git jq python python-gobject sqlite less nano
roots plasma-workspace plasma-desktop kwin kglobalacceld xwayland-kgsl xdg-desktop-portal-kde kscreen breeze breeze-icons
roots kirigami kirigami-addons libplasma plasma5support qqc2-desktop-style qqc2-breeze-style kdeplasma-addons
roots plasma-pa powerdevil konsole dolphin systemsettings qmltermwidget pyside6 scrcpy android-tools
roots mesa vulkan-freedreno vulkan-icd-loader vulkan-tools pipewire pipewire-pulse pipewire-jack pipewire-alsa wireplumber
roots fontconfig noto-fonts noto-fonts-emoji ttf-dejavu ttf-liberation xorg-xwayland xdg-utils shared-mime-info
# first-session.sh sets up Flathub (PowOS installs its Flatpaks per user).
roots flatpak
# The session's secrets keyring: SessionService starts gnome-keyring-daemon with every no-root session (browsers,
# VS Code, git keep passwords through org.freedesktop.secrets). 11-09 razr: the base lacked it ("exec:
# gnome-keyring-daemon: not found") and every app asking for a secret waited on a bus name nobody owned.
roots gnome-keyring libsecret
# The no-root engine runs every Linux program through lotfix-run: fakechroot (LD_PRELOAD libfakechroot.so) + fakeroot.
# Without them in the base nothing of the image starts on a phone without root (11-04 emulator: "sleep: command not found").
roots fakechroot fakeroot
# The PowOS terminal itself (Shell terminals, the AI page's sessions, Agents: all tmux) and its everyday tools: in
# the base, not in the apps pack (`pack apps rest` took them - a fresh phone had no tmux, Powback/PowOS#6; the 11-09
# razr base had powos-tmux-shell but no /usr/bin/tmux, so every terminal fell back to a bare shell).
roots tmux fzf btop fastfetch gum bash-completion
# PowOS's own services and source flow, which every no-root feature expects in the base. The GitHub CLI behind `powos
# login github` / `powos self push` / `powos setup` (lib/setup.sh) and the gh-issues tools: agents on the device fix,
# test and push locally (install-powos-android.sh installs it). SpacetimeDB: every PowOS app's database - the
# launcher's islands, the agents' board, `powos app install` (the registry) and `powos app build`'s TS bindings
# (spacetime generate) need it on day one; without root EngineServices starts it from the base (powos-noroot-services).
# gh#13 (S25, 11-09) and the 11-09 razr: in the apps pack (2.2 GB) /usr/lib/spacetimedb/2.12.0 was empty on the base
# and every app/widget path uninstallable without root. ~0.17 GiB unpacked.
roots spacetimedb github-cli

# Gaming: Steam (Valve's client bootstrap + Game Mode), FEX with its x86 rootfs, box64, the launchers.
pack gaming path usr/share/fex-emu/* usr/share/gamescope-session-plus/*
pack gaming pkg fex-emu box64 steam gamescope lutris mangohud umu-launcher steamos-manager-powerstation steam-notif-daemon gamemode-news-hook

# Apps people open later, and developer tools.
pack apps pkg brave-origin-bin mariadb mariadb-clients plasma-workspace-wallpapers qt6-webengine
# Homebrew's bottle archive (the image unpacks it on first `brew`).
pack apps path usr/share/homebrew.tar.zst
pack dev pkg gcc cmake meson ninja boost binutils gdb vulkan-headers linux-api-headers python-pip uv base-devel
# The Rust -> wasm toolchain for `powos app build` (tools/app-toolchain.sh, gh#13 A3): rustup's stable + wasm32, the
# app template's crates (vendored registry) and their wasm32 build. Its own pack, not dev's: a phone that added dev
# before the toolchain existed keeps dev's install marker, so `need dev` never brought it (razr 11-14: dev added, no
# /opt/powos-rust, "no Rust toolchain here"). Links build scripts with dev's gcc: `powos app build` asks for both.
pack rust path opt/powos-rust/*

# Languages other than English: app translations and glibc's compiled locales. The app adds it at install when
# Android's language isn't English.
pack languages pkg noto-fonts-cjk glibc-locales
pack languages path usr/share/locale/* usr/lib/locale/* usr/share/qt6/translations/*

# Everything else of the image: added from Settings > Storage, or by an app's first start.
pack apps rest
