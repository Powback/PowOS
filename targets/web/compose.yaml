# PowOS Web: PowOS running in the browser (QEMU compiled to WebAssembly), its disk streamed on demand.
#   https://powos-web.pow - LAN (and WireGuard) only, not exposed on powback.com
# Build first: build-qemu.sh, build-rootfs.sh, assemble.sh.
services:
  powos-web:
    image: nginx:alpine
    container_name: powos-web
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./out/site:/srv/site:ro
      - ./out/disk:/srv/disk:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.powos-web-local.rule=Host(`powos-web.pow`)"
      - "traefik.http.routers.powos-web-local.entrypoints=web"
      # HTTPS on the LAN name too, with Traefik's own self-signed certificate (no Let's Encrypt, no public name):
      # QEMU's threads need SharedArrayBuffer, which browsers only give a secure context (HTTPS or localhost).
      # Accept the certificate warning once.
      - "traefik.http.routers.powos-web-local-tls.rule=Host(`powos-web.pow`)"
      - "traefik.http.routers.powos-web-local-tls.entrypoints=websecure"
      - "traefik.http.routers.powos-web-local-tls.tls=true"
      # LAN + WireGuard only (PowStation's local-only allowlist): ports 80/443 face the internet, and a Host
      # header naming powos-web.pow would otherwise reach this from outside.
      # Plain http:// only redirects: over http the browser ignores COOP/COEP, so the page can never be
      # cross-origin isolated there ("not cross-origin isolated").
      - "traefik.http.middlewares.powos-web-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.powos-web-https.redirectscheme.permanent=true"
      - "traefik.http.routers.powos-web-local.middlewares=local-only@docker,powos-web-https"
      - "traefik.http.routers.powos-web-local-tls.middlewares=local-only@docker"
      - "traefik.http.services.powos-web.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
