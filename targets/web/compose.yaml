# PowOS Web: PowOS running in the browser (QEMU compiled to WebAssembly), its disk streamed on demand.
#   http://powos-web.pow (LAN)   https://powos-web.powback.com (behind Authelia)
# Build first: build-qemu.sh, build-disk.sh, assemble.sh.
services:
  powos-web:
    image: nginx:alpine
    container_name: powos-web
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./out/site:/srv/site:ro
      - ./out/disk:/srv/disk:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.powos-web.rule=Host(`powos-web.powback.com`)"
      - "traefik.http.routers.powos-web.entrypoints=websecure"
      - "traefik.http.routers.powos-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.powos-web-local.rule=Host(`powos-web.pow`)"
      - "traefik.http.routers.powos-web-local.entrypoints=web"
      - "traefik.http.services.powos-web.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
