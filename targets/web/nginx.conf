# PowOS Web. Cross-origin isolation (COOP/COEP) gives the page SharedArrayBuffer, which QEMU's threads need.
# The disk's chunks are immutable (named by their content's hash), so they're cached forever; they're
# already compressed, so no gzip on top.
server {
    listen 80;
    root /srv/site;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy cross-origin always;

    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream text/css;
    types { application/wasm wasm; }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
    }

    location /disk/ {
        alias /srv/disk/;
        gzip off;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        location /disk/chunks/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
        }
    }
}
