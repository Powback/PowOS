# powos-shell: the PowOS desktop shell's native host (docs/DESKTOP-WEB-SHELL.md). Our own code, no upstream: built
# from this folder and the repo's shell/ (the web UI it serves).
#
# Baked into the image by the Containerfile's powos-shell-builder stage (image-build.sh), against the image's own
# Qt / KF6 / Plasma - libtaskmanager makes no ABI promise, so it's built per image, like sources/kde/patches.
#   powos overlay build powos-shell   # the same build on a running system (the deps below installed)

SOURCE_NAME="powos-shell"
SOURCE_DESCRIPTION="PowOS desktop web shell host: shell/ in LayerShellQt QtWebEngine surfaces (panel, phase 0)"

BUILD_DEPS="gcc-c++ cmake ninja-build qt6-qtbase-devel qt6-qtwebengine-devel qt6-qtwebchannel-devel layer-shell-qt-devel plasma-workspace-devel kf6-kitemmodels-devel kf6-kservice-devel kf6-kio-devel"
RUNTIME_DEPS="qt6-qtwebengine qt6-qtwebchannel layer-shell-qt plasma-workspace-libs kf6-kservice kf6-kio-gui"
