# Non-root PowOS phones the ship service keeps current (tools/phone/nonroot-sync.sh): every APK the service installs
# on the main phone, and every shell ship (pushed into the app's own files/shell through run-as - the APK is a
# debuggable build, so `run-as com.powos.app` writes its data without root). LAN/VPN only: the Mac's adb, wireless
# debugging (paired once on the device: Settings > Developer options > Wireless debugging > Pair).
#
# One device per line: NAME MDNS
#   NAME   a short name for the logs and the state dir (~/.cache/powos-ship-queue/nonroot/NAME)
#   MDNS   the start of its adb mDNS service name (`adb mdns services`: adb-<serial>-<random>) - its port changes on
#          every wireless-debugging restart, so the address is looked up each run
razr adb-ZY22MQL54Q
