# PowOS's heavy arch-neutral jobs, run through tools/jobs/job.sh on the Docker context POW_JOB_CONTEXT names (default
# pow58; the hub when it doesn't answer). Each image bakes its source (build: context = a staged copy of the checkout's
# working state, made by job.sh), so a job needs no bind mount and runs on any x86_64 or arm64 engine.
#   tier1  test/tier1/run-all.sh                      (tools/agents/tier1.sh)
#   gate   the shell gate's headless-Chromium runs    (shell/dev/gate.sh: gate.mjs scenes, shots.mjs renders)
#   apk    the Android app's assembleDebug, unsigned  (targets/android/build-app.sh; signed on the hub, keys never leave it)
#   gradle-pool  warm Gradle daemons for compile checks + JVM tests (tools/jobs/gradle-pool.sh), long-lived, idle-ended
# Limits: .58 is shared with other projects - these three together stay at 24 of its 32 threads. cgroup_parent
# nomad.slice puts every job under .58's one hard cap for all job work (the user unit nomad.slice: CPUQuota 2400%,
# MemoryMax 128G, also where Nomad's podman jobs run; PowStation/docs/COMPUTE.md "Hard limits"); without it a job
# lands in user.slice, uncapped. On the hub (Colima dockerd, cgroupfs driver) it is just a parent cgroup dir.
# Caches: one Gradle home, one npm cache and the gate's transpile cache per machine (named volumes, shared by every run).
name: powos-jobs

x-pow:
  schema: powos.platform/v1
  owner: user
  host: any
  lifecycleAuthority: powos-container
  services:
    tier1:
      role: build-job
      lifecycle:
        policy: job
      access:
        exposure: none
        authentication: none
    gate:
      role: build-job
      lifecycle:
        policy: job
      access:
        exposure: none
        authentication: none
    apk:
      role: build-job
      lifecycle:
        policy: job
      access:
        exposure: none
        authentication: none
    gradle-pool:
      role: build-job
      lifecycle:
        policy: job
      access:
        exposure: none
        authentication: none
  datasets:
    gradle:
      role: cache
      cleanup: allowed
      mounts:
        - {service: apk, target: /root/.gradle}
    npm:
      role: cache
      cleanup: allowed
      mounts:
        - {service: tier1, target: /root/.npm}
    gradle-pool:
      role: cache
      cleanup: allowed
      note: The warm pool's Gradle home and each worktree's synced source + build dirs (/work); seeded from gradle.
      mounts:
        - {service: gradle-pool, target: /root/.gradle}
    gradle-pool-work:
      role: scratch
      cleanup: allowed
      mounts:
        - {service: gradle-pool, target: /work}
    gradle-seed:
      role: borrowed-state
      cleanup: never
      note: The apk job's Gradle home, read once to seed a new pool's (downloaded dependencies, Gradle distributions).
      mounts:
        - {service: gradle-pool, target: /seed}
    gate-tx:
      role: cache
      cleanup: allowed
      mounts:
        - {service: gate, target: /cache}
    engine-sock:
      role: runtime
      cleanup: never
      backup: not-applicable
      note: The job machine's own container engine socket (tier1's sibling test containers); no data.
      mounts:
        - {service: tier1, target: /run/engine.sock}

services:
  tier1:
    build:
      context: ${POW_JOB_SRC:?set by tools/jobs/job.sh}
      dockerfile: .jobs/Dockerfile
      labels:
        powos.job: tier1
        powos.job.checkout: ${POW_JOB_TAG:-local}
        powos.job.run: ${POW_JOB_RUN:-manual}
        powos.job.t0: ${POW_JOB_T0:-0}
    image: powos-jobs-tier1:${POW_JOB_TAG:-local}
    cgroup_parent: nomad.slice
    cpus: 6
    mem_limit: 8g
    environment:
      SHELL: /bin/bash
      DOCKER_HOST: unix:///run/engine.sock
    # The machine's own engine for the tests that start containers (complexity's detekt/clippy, loopback-unix,
    # publish-repo): .58's rootless podman socket (Docker API), the hub's dockerd when the job falls back there -
    # job.sh sets POW_JOB_ENGINE_SOCK per context. Siblings, not nested: tools/jobs/docker-sibling.sh copies bind
    # sources into them. label=disable: SELinux (enforcing on .58) denies container_t the user's socket otherwise.
    security_opt:
      - label=disable
    volumes:
      - npm:/root/.npm
      - type: bind
        source: ${POW_JOB_ENGINE_SOCK:-/run/user/1000/podman/podman.sock}
        target: /run/engine.sock
        bind:
          create_host_path: false
    labels:
      io.powos.unit: powos-jobs.tier1
      io.powos.autosleep: never

  gate:
    build:
      context: ${POW_JOB_SRC:?set by tools/jobs/job.sh}
      dockerfile: .jobs/Dockerfile
      labels:
        powos.job: gate
        powos.job.checkout: ${POW_JOB_TAG:-local}
        powos.job.run: ${POW_JOB_RUN:-manual}
        powos.job.t0: ${POW_JOB_T0:-0}
    image: powos-jobs-gate:${POW_JOB_TAG:-local}
    cgroup_parent: nomad.slice
    cpus: 10
    mem_limit: 12g
    shm_size: 1g
    init: true
    environment:
      GATE_CPUS: "10"
    # gate.mjs's transpile cache (by source hash, so never stale).
    volumes:
      - gate-tx:/cache
    labels:
      io.powos.unit: powos-jobs.gate
      io.powos.autosleep: never

  apk:
    build:
      context: ${POW_JOB_SRC:?set by tools/jobs/job.sh}
      dockerfile: .jobs/Dockerfile
      labels:
        powos.job: apk
        powos.job.checkout: ${POW_JOB_TAG:-local}
        powos.job.run: ${POW_JOB_RUN:-manual}
        powos.job.t0: ${POW_JOB_T0:-0}
    image: powos-jobs-apk:${POW_JOB_TAG:-local}
    cgroup_parent: nomad.slice
    cpus: 8
    mem_limit: 12g
    # The version stamp (as android-app-dev's build-gradle.sh: minutes since the epoch), set by apk-job.sh.
    environment:
      VERSION_CODE: ${VERSION_CODE:-1}
      VERSION_NAME: ${VERSION_NAME:-job}
    volumes:
      - gradle:/root/.gradle
    labels:
      io.powos.unit: powos-jobs.apk
      io.powos.autosleep: never

  # The warm Gradle pool (tools/jobs/gradle-pool.sh: compile-check.sh, jvm-offload.sh): one long-lived container whose
  # Gradle daemons stay up between runs - no image build, JVM, Gradle or Kotlin start per check, and no one-at-a-time
  # lock (the Mac warm builder's, up to 20 min of waiting 11-25). Each worktree syncs its working state into its own
  # /work/<checkout> (incremental per worktree); at most POOL_SLOTS builds at once (flock inside, waits are printed).
  # The image is the apk job's (same SDK). Its own Gradle home (another container's daemons can't be asked to
  # release a shared one's locks: f62), seeded once from the apk job's. Ends itself after POOL_IDLE_H (2) idle hours.
  gradle-pool:
    image: powos-jobs-apk:gradle-pool
    container_name: powos-gradle-pool
    cgroup_parent: nomad.slice
    cpus: 8
    mem_limit: 20g
    init: true
    environment:
      POOL_IDLE_H: "2"
    entrypoint: ["bash", "-c"]
    command:
      - 'touch /tmp/last-run; while [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/last-run) )) -lt $$(( POOL_IDLE_H * 3600 )) ]; do sleep 120; done'
    volumes:
      - gradle-pool:/root/.gradle
      - gradle-pool-work:/work
      - gradle:/seed:ro
    labels:
      io.powos.unit: powos-jobs.gradle-pool
      io.powos.autosleep: never

volumes:
  gradle:
    name: powos-jobs-gradle
  gradle-pool:
    name: powos-jobs-gradle-pool
  gradle-pool-work:
    name: powos-jobs-gradle-pool-work
  npm:
    name: powos-jobs-npm
  gate-tx:
    name: powos-jobs-gate-tx
