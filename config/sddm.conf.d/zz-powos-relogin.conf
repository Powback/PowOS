# Bazzite's holo.conf sets Relogin=true, which re-logs-in any session that
# exits. For a session that *cannot* start that is an infinite loop: with no
# network Steam's first-run update check exits, gamescope tears down, sddm
# relogs, the panel re-initialises, repeat every ~3s forever. Observed on a
# Deck as 32 x "Glfw Error 65550: X11: Failed to open display :0".
#
# false = autologin once per boot; if that session ends, show the greeter.
# /etc/sddm.conf.d sorts after /usr/lib/sddm/sddm.conf.d, so this wins.
[Autologin]
Relogin=false
