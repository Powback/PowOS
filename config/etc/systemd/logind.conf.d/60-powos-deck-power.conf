# PowOS (deck): the power button has THREE possible owners. Get the layering
# right or it does nothing in the mode you actually use.
#
#   1. GAME MODE (gamescope/Steam session) — Steam owns the button and handles
#      a short press itself. It takes a logind handle-power-key inhibitor, which
#      OVERRIDES everything below. Nothing here reaches it, and nothing here
#      should try to.
#   2. PLASMA DESKTOP — PowerDevil owns it, also via an inhibitor. Its action
#      comes from powerdevilrc (PowerButtonAction=1 = suspend-to-RAM).
#   3. NOBODY — the SDDM greeter, a console boot, a failed session. No inhibitor
#      is held, so logind itself decides.
#
# Case 3 is why this file exists. The previous config set HandlePowerKey=ignore,
# which is correct for 1 and 2 (defer to the session) but leaves case 3 with a
# button that is captured and then deliberately dropped — indistinguishable from
# dead hardware, and exactly the state a machine sitting at a greeter is in.
#
# `suspend` here is a FALLBACK, not an override: logind honours a session
# inhibitor first, so Steam and PowerDevil keep control whenever they are up.
HandlePowerKey=suspend

# A long press must always be able to kill a wedged machine, whoever owns the
# short press. Without this, a handheld whose session has hung has no way down
# except holding the button past the firmware's own cutoff.
HandlePowerKeyLongPress=poweroff

# The Deck has no lid; leave the lid handlers unset rather than guessing.
