# zz-powos-askpass.conf - askpass override for `systemd --user` services.
#
# The third and last environment that can raise a password prompt with no
# terminal attached: user units (Plasma 6 starts its session from them, and
# every Quadlet/podman user service on this box runs under them). Neither
# /etc/profile.d nor /etc/xdg/plasma-workspace/env reaches them.
#
# systemd merges /usr/lib/environment.d, /run/environment.d and
# /etc/environment.d by FILENAME, later wins. "zz-" puts this after
# 99-environment.conf and after powstream.conf, which has no numeric prefix
# and would otherwise sort last.
#
# This format is KEY=VALUE only — there is no way to express the `test -x`
# guard the two shell drop-ins carry. That is covered instead by a build-time
# assertion in the Containerfile: the image fails to build if these files ship
# without an executable /usr/bin/powos-askpass. Even if that were bypassed,
# the blast radius is `sudo -A` only; plain `sudo` still prompts on the tty.
SUDO_ASKPASS=/usr/bin/powos-askpass
SSH_ASKPASS=/usr/bin/powos-askpass
