# PowOS, DECK VARIANT ONLY: stop shipping hardware support a Deck cannot use.
#
# dracut defaults to hostonly=no, so the base image's initramfs can boot any
# machine. For an image whose only target is one AMD handheld that is dead
# weight, and it is not small. Measured on a Steam Deck's own initramfs:
#
#     firmware/nvidia   100.8 MB     <- no NVIDIA silicon exists in a Deck
#     modules i915       12.0 MB
#     modules xe         10.6 MB
#     firmware/i915       3.5 MB
#     firmware/xe         3.2 MB
#     firmware/intel      1.8 MB
#     firmware/radeon     1.4 MB
#
# against amdgpu, which it genuinely needs, at 47.7 MB of module and 24.6 MB
# of firmware. The GPU is an AMD Van Gogh [AMD Custom GPU 0405]; nouveau,
# i915, xe and radeon can never bind to anything in this machine.
#
# It costs twice: GRUB reads the whole 241 MB compressed image off btrfs
# before the kernel starts (7.5s of "loader" time), and then the initrd
# unpacks and walks it.
#
# This file must NEVER reach the main or nvidia-open variants — they need
# exactly these drivers. The Containerfile installs it only for *deck*.
# FORCE the ostree module in. This line is why the image boots at all.
#
# dracut decides whether to include its ostree module by AUTO-DETECTION, and
# the detection looks for a booted ostree system (/run/ostree-booted). Running
# dracut inside a container build there is no such thing, so it concludes
# ostree is not needed and silently omits it — producing an initramfs with no
# ostree-prepare-root, which cannot assemble the deployment, so switch-root
# has nothing to switch into:
#
#     Failed to start initrd-switch-root.service
#
# Nothing warns about this at build time. The initramfs simply comes out
# smaller and unbootable, which looks like a successful trim.
add_dracutmodules+=" ostree "

omit_drivers+=" nouveau nova i915 xe radeon "

# InfiniBand and RDMA. A Steam Deck has a single NVMe and a wifi chip; there
# is no fabric, no HCA, and nothing that could ever bind these. 2.7 MB of
# drivers/infiniband was being read off btrfs on every boot of a handheld.
omit_drivers+=" ib_.* mlx4_.* mlx5_.* rdma_.* iw_cm rpcrdma hfi1 qedr bnxt_re ocrdma "

# Software RAID. Nothing PowOS installs creates an md array, and a Deck has
# one disk. 5.6 MB of drivers/md, plus the dracut module that probes for
# arrays at boot.
omit_dracutmodules+=" mdraid "

# Filesystems the initramfs will never mount.
#
# What it genuinely needs is small and known: btrfs (the installed root),
# ext4 (the medium's /boot), vfat (the ESP), overlay (ramboot), and
# squashfs/erofs/isofs (live medium). Everything below is a cluster,
# network or museum filesystem that cannot appear on either path.
#
# Listed by exclusion rather than by a keep-list on purpose: a keep-list
# silently drops anything I failed to think of, and the failure mode is an
# unbootable machine. This way an unknown filesystem still ships.
omit_drivers+=" ceph gfs2 ocfs2 orangefs lustre afs coda ncpfs "
omit_drivers+=" jfs reiserfs minix affs befs hfs hfsplus ufs adfs bfs efs "
omit_drivers+=" freevxfs hpfs omfs qnx4 qnx6 sysv zonefs cramfs romfs "

# DELIBERATELY NOT OMITTED, and this matters:
#
#   drivers/scsi (27 MB) — the enterprise HBAs in here are useless, but the
#     SAME deck image is also the LIVE USB, which boots through usb-storage
#     and therefore the SCSI layer (sd_mod). Dropping the category wholesale
#     would produce a stick that cannot boot itself.
#   btrfs, ext4, vfat, overlay, squashfs, erofs, isofs — the boot paths that
#     actually exist. Never omit these.
#   ntfs3 and exfat — POWOS-GAMES is NTFS and SD cards are exfat. Neither is
#     mounted from the initramfs, but they cost little and removing them is
#     the kind of cleverness that breaks a games partition.
#
# drivers/scsi still needs a real USB boot on hardware before it is touched.
