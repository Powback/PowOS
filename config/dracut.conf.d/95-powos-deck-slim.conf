# PowOS, DECK VARIANT ONLY: stop shipping hardware support a Deck cannot use.
#
# dracut defaults to hostonly=no, so the base image's initramfs can boot any
# machine. For an image whose only target is one AMD handheld that is dead
# weight, and it is not small. Measured on a Steam Deck's own initramfs:
#
#     firmware/nvidia   100.8 MB     <- no NVIDIA silicon exists in a Deck
#     modules i915       12.0 MB
#     modules xe         10.6 MB
#     firmware/i915       3.5 MB
#     firmware/xe         3.2 MB
#     firmware/intel      1.8 MB
#     firmware/radeon     1.4 MB
#
# against amdgpu, which it genuinely needs, at 47.7 MB of module and 24.6 MB
# of firmware. The GPU is an AMD Van Gogh [AMD Custom GPU 0405]; nouveau,
# i915, xe and radeon can never bind to anything in this machine.
#
# It costs twice: GRUB reads the whole 241 MB compressed image off btrfs
# before the kernel starts (7.5s of "loader" time), and then the initrd
# unpacks and walks it.
#
# This file must NEVER reach the main or nvidia-open variants — they need
# exactly these drivers. The Containerfile installs it only for *deck*.
omit_drivers+=" nouveau nova i915 xe radeon "

# InfiniBand and RDMA. A Steam Deck has a single NVMe and a wifi chip; there
# is no fabric, no HCA, and nothing that could ever bind these. 2.7 MB of
# drivers/infiniband was being read off btrfs on every boot of a handheld.
omit_drivers+=" ib_.* mlx4_.* mlx5_.* rdma_.* iw_cm rpcrdma hfi1 qedr bnxt_re ocrdma "

# Software RAID. Nothing PowOS installs creates an md array, and a Deck has
# one disk. 5.6 MB of drivers/md, plus the dracut module that probes for
# arrays at boot.
omit_dracutmodules+=" mdraid "

# DELIBERATELY NOT OMITTED, and this matters:
#
#   drivers/scsi (27 MB) — the enterprise HBAs in here are useless, but the
#     SAME deck image is also the LIVE USB, which boots through usb-storage
#     and therefore the SCSI layer (sd_mod). Dropping the category wholesale
#     would produce a stick that cannot boot itself.
#   fs (39 MB) — most of these filesystems will never be mounted, but the
#     medium needs squashfs/erofs/isofs and the installed system needs
#     btrfs/ext4/vfat/overlay. Trimming this needs a real USB boot test; the
#     VM boots virtio and would not catch a broken USB or NVMe path.
#
# Both are worth doing later, with hardware in the loop.
