# Hollow Knight — PowOS mod + end-to-end test rules
#
# Windows build run under Proton (there is no native Linux build of 1.5.12620).
# Mods load through BepInEx 5 x64, injected by Unity Doorstop via winhttp.dll,
# which needs WINEDLLOVERRIDES="winhttp=n,b" in the Steam launch options.
#
# Note the deliberate single quotes on paths below: ${GAME_DIR} must survive
# being sourced and get expanded by the harness, which resolves it from the
# Steam library at run time.

GAME_NAME="Hollow Knight"
GAME_APPID=367520
GAME_BACKEND="bepinex"

GAME_FRAMEWORKS=(
    "bepinex5-x64:0:required"
)

GAME_INSTALL_RULES=(
    "*.dll:BepInEx/plugins"
    "*.cfg:BepInEx/config"
)

GAME_EXCLUDE_FROM_OVERLAY=(
    "compatdata"
    "shadercache"
)

GAME_VERIFY_CHECKS=(
    "file_exists:winhttp.dll"
    "dir_not_empty:BepInEx/plugins"
)

GAME_KNOWN_CONFLICTS=()

# ─── End-to-end testing (powos mods e2e hollowknight) ─────────────────────
#
# See lib/mods/e2e/CONTRACT.md for what each of these means and what a game
# has to expose before they can be filled in.

E2E_SCENARIO="hollowknight"

# The Proton process that IS the game. Used to wait for startup and to send
# SIGTERM on teardown; never SIGKILL (Proton/nvidia leak GPU memory).
E2E_PROCESS_MATCH="hollow_knight.exe"

# Virtual controllers to create. Three, because the case under test is a couch:
# pad 1 IS player one, pad 2 joins as player two, pad 3 joins as player three.
# Testing with player one on the keyboard instead is easier to set up and
# measures the wrong thing — it never checks that player one's own controller
# still works once a clone exists, which is the half that breaks.
E2E_PADS=3

E2E_LOG_FILES=(
    '${GAME_DIR}/BepInEx/LogOutput.log'
    '${HOME}/.local/share/Steam/steamapps/compatdata/367520/pfx/drive_c/users/steamuser/AppData/LocalLow/Team Cherry/Hollow Knight/Player.log'
)

# Proof the plugin loaded at all — distinguishes "game is up but the mod is
# not" from "nothing started". Advisory only: these logs are block-buffered,
# so its absence is not evidence of failure. The state channel is the gate.
E2E_LOAD_MARKER="Hollow Knight Couch Co-op"

# The state channel. HKCouchCoop serves live co-op state as JSON on loopback
# when its debug flag is on (CoopKit.DebugServer).
E2E_STATE_KIND="http-json"
E2E_STATE_URL="http://127.0.0.1:27600"
E2E_STATE_PATH="/state"
E2E_COMMAND_PATH="/cmd"
# Fallback the mod also writes, for when the socket is unreachable.
E2E_STATE_FILE='${GAME_DIR}/BepInEx/hkcoop-state.json'

E2E_WINDOW_MATCH="Hollow Knight"

# Focus the game window before driving it. Unity reads controllers through
# InControl, which does not poll while the application is unfocused — the pads
# enumerate but no button ever registers, which looks exactly like a broken
# mod. Measured, not assumed: the pad-identity test probes unfocused and
# focused and reports both.
E2E_FOCUS_WINDOW=1

# Cold start is slow: Steam, Proton prefix, shader cache, splash, title screen.
# Fallback only, used when Steam accepts the launch and no game appears —
# a signed-out client does exactly that. Same Proton build and the same
# winhttp override the launch options carry, so the binary under test is
# unchanged; it simply does not come through the client.
# Single-quoted: ${GAME_DIR} is expanded by the harness, not by the shell that
# sources this file — which runs under `set -u`, so an unknown name here does
# not fall back to empty, it takes the whole config down.
E2E_DIRECT_LAUNCH='"${GAME_DIR}/../../common/Proton 11.0/proton" run "${GAME_DIR}/hollow_knight.exe"'
E2E_DIRECT_ENV='STEAM_COMPAT_CLIENT_INSTALL_PATH=${GAME_DIR}/../../..;STEAM_COMPAT_DATA_PATH=${GAME_DIR}/../../compatdata/367520;WINEDLLOVERRIDES=winhttp=n,b'

E2E_READY_TIMEOUT=180
E2E_STOP_GRACE=45

# Settings the harness turns on for the run and restores afterwards. The debug
# channel is off in any normal install and must stay that way.
# Syntax: <path>:[Section]Key=Value. The section is not optional decoration —
# BepInEx scopes settings to it, and a key written outside its section is read
# as a different setting entirely and silently keeps its default.
E2E_CONFIG_SET=(
    '${GAME_DIR}/BepInEx/config/com.powback.hkcouchcoop.cfg:[Debug]DebugServer=true'
    '${GAME_DIR}/BepInEx/config/com.powback.hkcouchcoop.cfg:[Debug]DebugServerPort=27600'
    # Player one's pad needs no setting. PlayerOnePadIndex used to select it
    # and was written here; the mod removed it in v0.7.10 after finding it
    # dead — bound and documented, read by nothing since the v0.7.0 assignment
    # matrix. The mod now treats whichever device has actually been driving
    # player one as theirs, which the scenario arranges by moving player one on
    # pad 1 before any join (case 5).
)

# Save slot to load. Hollow Knight names slot 0 "user.dat" and slot N
# "userN.dat", so the first save made in the UI is slot 1, not 0. Left empty,
# the scenario picks the lowest slot that actually has a file — which is more
# reliable than any number written here.
E2E_SAVE_SLOT=

# Loading a save and walking the Knight around WRITES to that save (autosave on
# room transitions). Copied before the run and put back afterwards, including
# when the run fails.
#
# Globs, not the folder: Player.log lives in that same directory, so restoring
# the whole thing also reverted the run's own game log to the previous run's
# copy — which made every log-based diagnosis read stale lines.
E2E_BACKUP=(
    '${HOME}/.local/share/Steam/steamapps/compatdata/367520/pfx/drive_c/users/steamuser/AppData/LocalLow/Team Cherry/Hollow Knight/user*.dat*'
)
