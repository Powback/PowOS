# PowOS: guarantee the built-in account has a home directory.
#
# The image bakes in a 'powos' user, but /var is EMPTY on a fresh bootc
# install, so /var/home/powos does not exist there. The account is real, the
# home is not.
#
# sddm autologins that user straight into gamescope. A session with no home
# dies immediately — "Session crashed (exit code 3)" — and sddm restarts it,
# forever. On screen that is a black screen with a cursor, on a machine whose
# install went perfectly. It is indistinguishable from a failed install, and
# was diagnosed as one.
#
# powos-firstboot creates this too, but only when it runs at all: it is gated
# on /etc/powos/install.conf, which the guided installer has to copy onto the
# target and which will not exist for a hand-rolled `bootc install`. This rule
# runs on every boot and needs nothing.
#
#type path             mode uid   gid   age argument
d      /var/home/powos 0700 powos powos -
