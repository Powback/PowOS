# /etc/tmux.conf — PowOS system-wide tmux defaults.
#
# The point of this file is that closing a terminal must never lose work, and
# neither must rebooting. PowOS terminals already run inside tmux (Konsole's
# PowOS.profile runs /usr/lib/powos/powos-tmux-shell as its Command, so Konsole
# tabs, Dolphin's F4 panel and Yakuake all land here). That covers a closed tab,
# a logout, a Plasma crash and an SSH drop — but NOT a reboot, because the tmux
# server dies with the kernel.
#
# resurrect + continuum close that last gap: continuum autosaves on a timer and
# restores when the server next starts, so the first terminal you open after a
# restart brings your windows, splits and working directories back.
#
# Honest about the limit: this restores WHERE YOU WERE, not running processes.
# Nothing can resurrect a live process across a reboot. Long jobs still need to
# be re-run.

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10           # no lag on Esc in vim/fzf
set -g focus-events on

# Keep saves out of $HOME's dotfile soup; XDG state is the right place for data
# that is regenerable but worth persisting.
set -g @resurrect-dir '~/.local/state/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Plugins are vendored into the image (see Containerfile) rather than fetched by
# tpm at runtime, so this works offline and on a read-only /usr.
run-shell /usr/share/tmux-plugins/tmux-resurrect/resurrect.tmux
run-shell /usr/share/tmux-plugins/tmux-continuum/continuum.tmux
