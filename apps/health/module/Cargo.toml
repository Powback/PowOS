[package]
name = "powos-app-health"
# The module's version (env!("CARGO_PKG_VERSION") in src/lib.rs): bump it to see a hot republish land.
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the device's server (SpacetimeDB 2.12 on every PowOS machine).
spacetimedb = "=2.12.0"
log = "0.4"
