[package]
name = "powos-app-keyboard-ai"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the device's server (SpacetimeDB 2.12 on every PowOS machine).
spacetimedb = "=2.12.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
